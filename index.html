<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>楽譜トレーナー</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161920; --sunken:#11141a; --line:rgba(255,255,255,.085);
    --text:#e9eaef; --muted:#8d92a3; --accent:#c9a962; --accent-ink:#15171c;
    --ok:#7fbd97; --ng:#cf7b78; --paper:#f6f3ea; --ink:#1c1e26;
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; padding:22px 14px 44px; background:var(--bg); color:var(--text);
       font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
       text-align:center; user-select:none; -webkit-font-smoothing:antialiased;}

  header{max-width:600px; margin:0 auto 20px;}
  h1{font-family:var(--serif); font-size:25px; font-weight:600; letter-spacing:.2em;
     margin:0 0 8px; text-indent:.2em;}
  .tagline{font-size:10.5px; color:var(--muted); letter-spacing:.2em;}
  .nav{margin-top:14px; font-size:12px;}
  .nav a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:3px;}
  .nav a:hover{color:var(--accent); border-color:var(--accent);}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;
        margin:0 auto 14px; max-width:600px; box-shadow:0 12px 32px rgba(0,0,0,.34);}

  /* ---- 設定 ---- */
  .settings{display:grid; grid-template-columns:1fr 1fr; text-align:left;}
  .settings .full{grid-column:1/-1; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line);}
  .col{padding:0 20px;}
  .col-main{padding-left:0;}
  .col-opt{padding-right:0; border-left:1px solid var(--line);}
  .col>h2{font-size:9.5px; letter-spacing:.2em; color:var(--muted); font-weight:600; margin:0 0 14px;}
  .col-opt>summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px;
       font-size:9.5px; letter-spacing:.2em; color:var(--muted); font-weight:600; margin-bottom:14px;}
  .col-opt>summary::-webkit-details-marker{display:none;}
  .col-opt>summary::after{content:""; width:5px; height:5px; border-right:1px solid currentColor;
       border-bottom:1px solid currentColor; transform:translateY(-2px) rotate(45deg); transition:transform .2s;}
  .col-opt[open]>summary::after{transform:translateY(1px) rotate(225deg);}
  .col-opt:not([open]){border-left-color:transparent;}
  .col-opt>summary:hover{color:var(--text);}
  .vol{display:flex; align-items:center; gap:10px;}
  .vol input[type=range]{-webkit-appearance:none; appearance:none; flex:1; height:4px; border-radius:2px;
       background:var(--sunken); border:1px solid var(--line); accent-color:var(--accent);}
  .vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px;
       border-radius:50%; background:var(--accent); border:0; cursor:pointer;}
  .vol input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%;
       background:var(--accent); border:0; cursor:pointer;}
  .vol b{font-size:10.5px; color:var(--muted); font-weight:600; width:34px; text-align:right;
         font-variant-numeric:tabular-nums;}
  .field+.field{margin-top:14px;}
  .field>label{display:block; font-size:11px; color:var(--muted); letter-spacing:.1em; margin-bottom:7px;}

  .seg{display:inline-flex; background:var(--sunken); border:1px solid var(--line);
       border-radius:10px; padding:3px; flex-wrap:wrap; gap:2px;}
  .seg button{background:transparent; color:var(--muted); border:0; border-radius:8px;
              padding:7px 12px; font-size:12.5px; font-weight:600; letter-spacing:.03em;
              font-family:inherit; transition:background .15s, color .15s;}
  .seg button:hover{color:var(--text);}
  .seg button.on{background:var(--accent); color:var(--accent-ink);}

  .stats{display:flex; justify-content:center; gap:38px; margin:20px 0 16px;
         padding-top:18px; border-top:1px solid var(--line);}
  .stats div span{display:block; font-family:var(--serif); font-size:27px; font-weight:600;
                  line-height:1.1; font-variant-numeric:tabular-nums;}
  .stats div small{display:block; margin-top:5px; font-size:9.5px; color:var(--muted); letter-spacing:.16em;}
  .bigbtn{width:100%; max-width:280px; background:var(--accent); color:var(--accent-ink); border:0;
          border-radius:10px; padding:13px 0; font-size:13.5px; font-weight:700;
          letter-spacing:.18em; font-family:inherit; text-indent:.18em;}
  .bigbtn:hover{filter:brightness(1.07);}

  /* ---- 残り時間（数字ではなく細い線） ---- */
  .timerbar{height:2px; background:var(--line); border-radius:1px; overflow:hidden;
            margin:0 0 16px; visibility:hidden;}
  .timerbar i{display:block; height:100%; background:var(--accent);
              transform-origin:left center; transform:scaleX(1);}

  /* ---- 譜面（紙の質感） ---- */
  .paper{background:var(--paper); border-radius:10px; padding:10px 6px 6px;
         box-shadow:inset 0 0 0 1px rgba(0,0,0,.07), 0 1px 0 rgba(255,255,255,.04);}
  svg{display:block; margin:0 auto; width:100%; max-width:440px; height:auto;}
  .cap{font-size:10.5px; color:var(--muted); letter-spacing:.16em; margin-top:12px;}
  .feedback{height:22px; font-size:13px; font-weight:700; letter-spacing:.12em; margin:10px 0 2px;}
  #staff .note{transition:opacity .21s ease, transform .21s ease;}
  #staff .note.in{opacity:0; transform:translateY(7px);}
  #staff .note.out{opacity:0; transform:translateY(-7px);}
  @keyframes staffShake{
    0%{transform:translateX(0)} 16%{transform:translateX(-6px)} 32%{transform:translateX(5px)}
    48%{transform:translateX(-3px)} 66%{transform:translateX(2px)} 100%{transform:translateX(0)}}
  .paper.shake{animation:staffShake .38s ease-out;}
  @media(prefers-reduced-motion:reduce){
    #staff .note{transition:none;} .paper.shake{animation:none;}}

  .weak{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center;
        font-size:11px; color:var(--muted); margin-top:10px; min-height:0;}
  .weak .lb{letter-spacing:.14em;}
  .chip{border:1px solid var(--line); border-radius:999px; padding:3px 11px; color:var(--text);}
  .chip.hot{border-color:var(--accent); color:var(--accent);}
  .weak button{background:transparent; border:1px solid var(--line); color:var(--muted);
               border-radius:999px; padding:3px 11px; font-size:10.5px; font-family:inherit;}
  .weak button:hover{color:var(--text);}

  /* ---- 回答パネル ---- */
  .keys{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:16px;}
  .keys button{padding:14px 0; border:1px solid var(--line); border-radius:10px; background:var(--sunken);
               color:var(--text); font-size:15px; font-weight:600; font-family:inherit;}
  .keys button small{display:block; margin-top:4px; font-size:9.5px; color:var(--muted);
                     font-weight:500; letter-spacing:.14em;}
  .keys button:active{background:var(--accent); color:var(--accent-ink);}
  .keys button:active small{color:var(--accent-ink);}

  .pianoWrap{overflow-x:auto; padding:8px 0; margin-top:16px;}
  .piano{position:relative; height:148px; margin:0 auto; display:inline-block;}
  .wkey{position:absolute; top:0; width:42px; height:148px; background:var(--paper);
        border:1px solid #c6c0b1; border-radius:0 0 5px 5px; color:#8d8879; font-size:9.5px;
        display:flex; align-items:flex-end; justify-content:center; padding-bottom:7px;
        font-weight:700; letter-spacing:.06em;}
  .wkey:active{background:var(--accent); color:var(--accent-ink);}
  .bkey{position:absolute; top:0; width:26px; height:93px; background:#1c1e26; border:1px solid #07080b;
        border-radius:0 0 4px 4px; z-index:2;}
  .bkey:active{background:var(--accent);}
  .kbscroll{-webkit-appearance:none; appearance:none; display:block; width:100%; max-width:440px;
            height:6px; border-radius:3px; background:var(--sunken); border:1px solid var(--line);
            margin:10px auto 2px;}
  .kbscroll::-webkit-slider-thumb{-webkit-appearance:none; width:56px; height:22px; border-radius:11px;
            background:var(--accent); border:2px solid var(--panel);}
  .kbscroll::-moz-range-thumb{width:56px; height:22px; border-radius:11px;
            background:var(--accent); border:2px solid var(--panel);}
  .kbcap{font-size:10.5px; color:var(--muted); letter-spacing:.1em; margin-top:4px;}

  .listen{font-size:12.5px; color:var(--muted); min-height:22px; margin-top:16px; letter-spacing:.04em;}
  .detected{font-family:var(--serif); font-size:26px; font-weight:600; color:var(--accent); margin-top:6px;}

  .hidden{display:none;}
  .hint{max-width:600px; margin:18px auto 0; color:var(--muted); font-size:11.5px;
        line-height:1.95; text-align:left;}
  .hint b{color:var(--text); font-weight:600;}
  .hint p{margin:0 0 8px;}
  .hint p:last-child{margin:0;}

  @media(max-width:540px){
    .settings{grid-template-columns:1fr;}
    .col{padding:0;}
    .col-opt{border-left:0; border-top:1px solid var(--line); margin-top:18px; padding-top:18px;}
    .stats{gap:26px;}
  }
</style>
</head>
<body>
<header>
  <h1>楽譜トレーナー</h1>
  <div class="tagline">SIGHT-READING PRACTICE</div>
  <div class="nav"><a href="phrase.html">フレーズ練習（PCキーボードで演奏）へ</a></div>
</header>

<div class="card">
  <div class="settings">
    <div class="full field">
      <label>回答方法</label>
      <div class="seg" id="methodSeg">
        <button data-m="name" class="on">音名ボタン</button>
        <button data-m="piano">画面の鍵盤</button>
        <button data-m="mic">マイク入力</button>
      </div>
    </div>

    <div class="col col-main">
      <h2>出題</h2>
      <div class="field">
        <label>音部記号</label>
        <div class="seg" id="clefSeg">
          <button data-c="treble" class="on">ト音</button>
          <button data-c="bass">ヘ音</button>
          <button data-c="both">混合</button>
        </div>
      </div>
      <div class="field">
        <label>音域</label>
        <div class="seg" id="rangeSeg">
          <button data-r="narrow" class="on">1オクターブ</button>
          <button data-r="wide">2オクターブ</button>
        </div>
      </div>
    </div>

    <details class="col col-opt">
      <summary>オプション</summary>
      <div class="field">
        <label>制限時間</label>
        <div class="seg" id="timeSeg">
          <button data-t="60" class="on">60秒</button>
          <button data-t="90">90秒</button>
          <button data-t="120">120秒</button>
          <button data-t="0">なし</button>
        </div>
      </div>
      <div class="field">
        <label>苦手音の出題</label>
        <div class="seg" id="focusSeg">
          <button data-f="on" class="on">重点的に</button>
          <button data-f="off">均等に</button>
        </div>
      </div>
      <div class="field">
        <label>正解時の和音</label>
        <div class="vol">
          <input type="range" id="vol" min="0" max="100" value="45" aria-label="正解時の和音の音量">
          <b id="volVal">45</b>
        </div>
      </div>
    </details>
  </div>

  <div class="stats">
    <div><span id="score">0</span><small>正解数</small></div>
    <div><span id="streak">0</span><small>連続正解</small></div>
  </div>
  <button class="bigbtn" id="startBtn">開始</button>
</div>

<div class="card">
  <div class="timerbar" id="timerbar"><i id="timerFill"></i></div>
  <div class="paper" id="paper"><svg id="staff" viewBox="0 0 440 176" aria-label="staff"></svg></div>
  <div class="cap" id="clefCap"></div>
  <div class="feedback" id="feedback"></div>
  <div class="weak" id="weak"></div>

  <div id="namePanel" class="keys">
    <button data-note="0">ド<small>C</small></button>
    <button data-note="2">レ<small>D</small></button>
    <button data-note="4">ミ<small>E</small></button>
    <button data-note="5">ファ<small>F</small></button>
    <button data-note="7">ソ<small>G</small></button>
    <button data-note="9">ラ<small>A</small></button>
    <button data-note="11">シ<small>B</small></button>
  </div>

  <div id="pianoPanel" class="hidden">
    <div class="pianoWrap" id="pianoScroll"><div class="piano" id="piano"></div></div>
    <input type="range" id="kbScroll" class="kbscroll" min="0" max="100" value="0" aria-label="鍵盤をスクロール">
    <div class="kbcap">鍵盤は左右にスクロールできます</div>
  </div>

  <div id="micPanel" class="hidden">
    <div class="listen" id="listenMsg">開始するとマイクの使用許可を求めます。表示された音符を楽器で演奏してください。</div>
    <div class="detected" id="detected">—</div>
  </div>
</div>

<div class="hint" id="hint"></div>

<script>
/* ---------- 音符データ ---------- */
const PC_TO_LETTER={0:"C",2:"D",4:"E",5:"F",7:"G",9:"A",11:"B"};
const PC_TO_SOLFEGE={0:"ド",2:"レ",4:"ミ",5:"ファ",7:"ソ",9:"ラ",11:"シ"};
const LETTER_INDEX={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
const isNatural=m=>PC_TO_LETTER[((m%12)+12)%12]!==undefined;

function midiInfo(m){
  const pc=((m%12)+12)%12, octave=Math.floor(m/12)-1, letter=PC_TO_LETTER[pc];
  const diatonic=letter!==undefined ? octave*7+LETTER_INDEX[letter] : null;
  return {midi:m,pc,octave,letter,diatonic,solfege:PC_TO_SOLFEGE[pc]};
}
// 各記号ごとの「一番下の線」の音（diatonic基準）
const CLEF_BOTTOM={treble:4*7+LETTER_INDEX.E /*E4=30*/, bass:2*7+LETTER_INDEX.G /*G2=18*/};
/* 音部記号の字形は Bravura（(c) Steinberg Media Technologies GmbH / SIL Open Font License 1.1）
   から取り出したもの。ライセンス全文はリポジトリの OFL.txt を参照。
   SMuFLの規約どおり、座標系は「線間=1、原点のyが基準線（ト音記号=G4線、ヘ音記号=F3線）」。 */
const CLEF_PATH={
 treble:"M1.504 -1.66C1.496 -1.708 1.504 -1.712 1.528 -1.736C1.592 -1.796 1.676 -1.88 1.752 -1.964C2.088 -2.332 2.288 -2.808 2.288 -3.26C2.288 -3.608 2.192 -3.952 2.028 -4.192C1.968 -4.28 1.864 -4.392 1.82 -4.392C1.764 -4.392 1.64 -4.288 1.56 -4.2C1.264 -3.872 1.168 -3.372 1.168 -2.956C1.168 -2.724 1.196 -2.464 1.224 -2.3C1.232 -2.252 1.236 -2.244 1.188 -2.204C.932 -1.992 .656 -1.748 .448 -1.492C.172 -1.148 0 -.776 0 -.348C0 .348 .476 1.008 1.456 1.008C1.548 1.008 1.652 1 1.732 .984C1.776 .976 1.784 .972 1.792 1.02C1.84 1.288 1.9 1.636 1.9 1.824C1.9 2.416 1.5 2.488 1.264 2.488C1.048 2.488 .944 2.424 .944 2.372C.944 2.344 .98 2.332 1.072 2.304C1.196 2.268 1.34 2.16 1.34 1.928C1.34 1.708 1.2 1.52 .956 1.52C.688 1.52 .528 1.732 .528 1.98C.528 2.24 .684 2.632 1.288 2.632C1.556 2.632 2.076 2.512 2.076 1.832C2.076 1.604 2.004 1.224 1.96 .976C1.952 .928 1.956 .932 2.012 .908C2.416 .748 2.684 .408 2.684 -.044C2.684 -.556 2.308 -1.008 1.72 -1.008C1.616 -1.008 1.616 -1.008 1.604 -1.08ZM1.88 -3.772C2.012 -3.772 2.12 -3.664 2.12 -3.444C2.12 -3.168 1.988 -2.912 1.676 -2.6C1.612 -2.536 1.516 -2.444 1.424 -2.364C1.396 -2.34 1.38 -2.344 1.372 -2.396C1.356 -2.5 1.348 -2.636 1.348 -2.764C1.348 -3.388 1.636 -3.772 1.88 -3.772ZM1.444 -1.048C1.456 -.972 1.456 -.976 1.384 -.952C1.032 -.832 .804 -.516 .804 -.176C.804 .184 .992 .44 1.264 .532C1.296 .544 1.344 .556 1.372 .556C1.404 .556 1.42 .536 1.42 .512C1.42 .484 1.388 .472 1.36 .46C1.192 .388 1.072 .216 1.072 .032C1.072 -.196 1.228 -.368 1.472 -.436C1.536 -.452 1.544 -.448 1.552 -.404L1.752 .788C1.76 .832 1.756 .832 1.696 .844C1.632 .856 1.552 .864 1.472 .864C.772 .864 .32 .476 .32 -.08C.32 -.316 .36 -.632 .692 -1.008C.932 -1.276 1.116 -1.424 1.304 -1.576C1.344 -1.608 1.352 -1.604 1.36 -1.56ZM1.72 -.412C1.712 -.46 1.716 -.472 1.764 -.468C2.088 -.44 2.356 -.168 2.356 .184C2.356 .436 2.204 .64 1.98 .752C1.932 .776 1.924 .776 1.916 .728Z",
 bass:"M1.008 -1.048C.312 -1.048 0 -.54 0 -.156C0 .164 .168 .44 .492 .44C.744 .44 .916 .264 .916 .016C.916 -.24 .728 -.4 .532 -.4C.424 -.4 .384 -.372 .332 -.372C.28 -.372 .268 -.404 .268 -.444C.268 -.604 .508 -.896 .916 -.896C1.34 -.896 1.524 -.48 1.524 .148C1.524 .56 1.436 1.04 1.188 1.424C.948 1.796 .536 2.136 .04 2.42C.004 2.44 -.02 2.46 -.02 2.492C-.02 2.516 -.004 2.54 .032 2.54C.052 2.54 .076 2.532 .1 2.52C.632 2.26 1.144 1.956 1.568 1.5C1.916 1.124 2.124 .636 2.124 .112C2.124 -.584 1.7 -1.048 1.008 -1.048ZM2.516 -.72C2.392 -.72 2.296 -.624 2.296 -.5C2.296 -.376 2.392 -.28 2.516 -.28C2.64 -.28 2.736 -.376 2.736 -.5C2.736 -.624 2.64 -.72 2.516 -.72ZM2.52 .284C2.396 .284 2.304 .376 2.304 .5C2.304 .624 2.396 .716 2.52 .716C2.644 .716 2.736 .624 2.736 .5C2.736 .376 2.644 .284 2.52 .284Z"};
const CLEF_REF={treble:2, bass:6};   // 基準線の位置（下線からの半音程数）
const CLEF_DX ={treble:6, bass:6};   // 五線の左端からの距離
const CLEF_NAME ={treble:"ト音記号", bass:"ヘ音記号"};

// 記号×範囲ごとの出題プール（ナチュラルのみ）
const RANGE_MIDI={
  treble:{narrow:[60,72], wide:[60,84]},   // C4–C5 / C4–C6
  bass:  {narrow:[48,60], wide:[36,60]},   // C3–C4 / C2–C4
};
function naturals(lo,hi){ const a=[]; for(let m=lo;m<=hi;m++) if(isNatural(m)) a.push(m); return a; }

/* ---------- 五線描画 ---------- */
const NS="http://www.w3.org/2000/svg", staff=document.getElementById("staff");
const INK="#1c1e26";
const LINE_GAP=16, X_LEFT=44, X_RIGHT=420, X_NOTE=250, Y_BOTTOM=120;
/* 彫版の標準比率（線間=1として）：五線0.13 / 加線0.16 / 符幹0.12・長さ3.5 / 符頭幅1.18・高さ1.0 */
const W_STAFF=LINE_GAP*0.13, W_LEDGER=LINE_GAP*0.16, W_STEM=LINE_GAP*0.12,
      L_STEM =LINE_GAP*3.5,  R_HEAD_X=9.6, R_HEAD_Y=7.8, LEDGER_HALF=LINE_GAP*0.99;
function clearSvg(){ while(staff.firstChild) staff.removeChild(staff.firstChild); }
function line(x1,y1,x2,y2,w=W_STAFF,color=INK,parent=staff){
  const l=document.createElementNS(NS,"line");
  l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
  l.setAttribute("stroke",color);l.setAttribute("stroke-width",w);parent.appendChild(l);
}
const yForSteps=s=>Y_BOTTOM-s*(LINE_GAP/2);
function drawStaff(clef){
  clearSvg();
  for(let i=0;i<5;i++) line(X_LEFT,Y_BOTTOM-i*LINE_GAP,X_RIGHT,Y_BOTTOM-i*LINE_GAP);
  const c=document.createElementNS(NS,"path");
  c.setAttribute("d",CLEF_PATH[clef]); c.setAttribute("fill",INK);
  c.setAttribute("transform",`translate(${X_LEFT+CLEF_DX[clef]},${yForSteps(CLEF_REF[clef])}) scale(${LINE_GAP})`);
  staff.appendChild(c);
}
let noteG=null;
function drawNote(m,clef,animate){
  drawStaff(clef);
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","note"); staff.appendChild(g);
  noteG=g;
  const steps=midiInfo(m).diatonic - CLEF_BOTTOM[clef];
  const y=yForSteps(steps);
  for(let sp=-2;sp>=steps;sp-=2) line(X_NOTE-LEDGER_HALF,yForSteps(sp),X_NOTE+LEDGER_HALF,yForSteps(sp),W_LEDGER,INK,g);
  for(let sp=10;sp<=steps;sp+=2) line(X_NOTE-LEDGER_HALF,yForSteps(sp),X_NOTE+LEDGER_HALF,yForSteps(sp),W_LEDGER,INK,g);
  const head=document.createElementNS(NS,"ellipse");
  head.setAttribute("cx",X_NOTE);head.setAttribute("cy",y);
  head.setAttribute("rx",R_HEAD_X);head.setAttribute("ry",R_HEAD_Y);
  head.setAttribute("transform",`rotate(-20 ${X_NOTE} ${y})`);head.setAttribute("fill",INK);g.appendChild(head);
  const up=steps<4, sx=up?X_NOTE+(R_HEAD_X-W_STEM/2):X_NOTE-(R_HEAD_X-W_STEM/2), sy2=up?y-L_STEM:y+L_STEM;
  line(sx,y,sx,sy2,W_STEM,INK,g);
  if(animate){ g.classList.add("in");
    requestAnimationFrame(()=>requestAnimationFrame(()=>g.classList.remove("in"))); }
}

/* ---------- 状態 ---------- */
let method="name", clefMode="treble", rangeMode="narrow";
let timeLimit=60, focusWeak=true;
let combined=[], bag=[], target=null, prev=null, prevKey=null;
let running=false, score=0, streak=0, rafTimer=null, startTs=0, msgId=null;

/* ---------- 苦手音の記録（ブラウザに保存） ---------- */
const MISS_STORE="gakufuTrainer.miss.v1";
let miss={};
try{ miss=JSON.parse(localStorage.getItem(MISS_STORE)||"{}"); }catch(e){ miss={}; }
function saveMiss(){ try{ localStorage.setItem(MISS_STORE,JSON.stringify(miss)); }catch(e){} }
// まちがえたら+2、せいかいで-1（＝1回のミスは2回連続で当てるまで残る）
function noteMissed(k){ miss[k]=Math.min(6,(miss[k]||0)+2); saveMiss(); }
function noteHit(k){ if(miss[k]){ miss[k]--; if(!miss[k]) delete miss[k]; saveMiss(); } }
// 苦手度に応じて、その音の札を1周あたり最大3枚まで増やす
const cardsFor=k=>{ if(!focusWeak) return 1; const m=miss[k]||0; return m>=3?3:(m>=1?2:1); };
const el=id=>document.getElementById(id);
const setStats=()=>{el("score").textContent=score;el("streak").textContent=streak;};
/* 残り時間は数字ではなく、譜面の上の細い線が減っていく形で示す */
function tickTimer(){
  if(!running||!timeLimit) return;
  const total=timeLimit*1000, left=Math.max(0,total-(Date.now()-startTs));
  el("timerFill").style.transform="scaleX("+(left/total)+")";
  if(left<=0){ endGame(); return; }
  rafTimer=requestAnimationFrame(tickTimer);
}
/* 短いメッセージ（節目の連続正解・不正解）。ふだんの正解では何も出さない */
function showMsg(text,color,ms){
  const f=el("feedback"); f.textContent=text; f.style.color=color;
  clearTimeout(msgId); msgId=setTimeout(()=>{ f.textContent=""; },ms);
}
const isMilestone=n=> n===5 || n===10 || (n>10 && n%10===0);

function buildPools(){
  const clefs = clefMode==="both" ? ["treble","bass"] : [clefMode];
  combined=[]; bag=[];
  clefs.forEach(c=>{
    const [lo,hi]=RANGE_MIDI[c][rangeMode];
    naturals(lo,hi).forEach(m=>combined.push({midi:m, clef:c, diatonic:midiInfo(m).diatonic}));
  });
}

/* 出題は「シャッフルした山札」から配る方式。
   1周ですべての答えを1回ずつ出しきってから切り直すので、出題頻度が均等になる。
   （以前のランダム＋やり直し方式だと、端の音が約1.14倍出やすかった）
   音名ボタンのときは答えが「音名」なので、C4とC5のように同じ音名の音は1枚にまとめる。
   ドからドまでの音域だとドだけ2〜3枚あることになり、「ド」が2倍出ていたため。 */
function answerKey(o){
  return method==="name" ? o.clef+"|n|"+(((o.midi%12)+12)%12) : o.clef+"|m|"+o.midi;
}
function addCycle(){
  const groups=new Map();
  combined.forEach(o=>{ const k=answerKey(o);
    if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(o); });
  const cycle=[];
  groups.forEach((g,k)=>{ for(let n=cardsFor(k);n>0;n--) cycle.push(g); });
  for(let i=cycle.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cycle[i],cycle[j]]=[cycle[j],cycle[i]]; }
  bag=bag.concat(cycle);
}
/* 同じ音・隣接する音は連続で出さない。使えない札は山札に残して後回しにするだけなので、
   「1周で全部1回ずつ」は崩れない（＝均等さを保ったまま連続を避けられる） */
const tooClose=(o,p)=>!!p && o.clef===p.clef && Math.abs(o.diatonic-p.diatonic)<2;
const spaced=g=>g.some(o=>!tooClose(o,prev));
// 苦手音は札が複数あるので、同じ答えが2連続にならないことも条件に入れる
const usable=g=>answerKey(g[0])!==prevKey && spaced(g);
function pickTarget(){
  if(!bag.length) addCycle();
  let idx=bag.findIndex(usable);
  if(idx<0){ addCycle(); idx=bag.findIndex(usable); }   // 残り札が全部使えないときは次の周を先に足す
  if(idx<0) idx=bag.findIndex(spaced);
  if(idx<0) idx=0;
  const group=bag.splice(idx,1)[0];
  const ok=group.filter(o=>!tooClose(o,prev));
  const from=ok.length?ok:group;
  const cand=from[Math.floor(Math.random()*from.length)];
  prev=cand; prevKey=answerKey(cand); return cand;
}
function newTarget(animate){
  target=pickTarget();
  drawNote(target.midi,target.clef,animate);
  el("clefCap").textContent=CLEF_NAME[target.clef];
  if(method==="mic") el("detected").textContent="—";
}

function correct(){
  playChord(target.midi);
  noteHit(answerKey(target));
  score++; streak++; setStats();
  if(noteG) noteG.classList.add("out");
  if(isMilestone(streak)) showMsg(streak+" 連続","var(--accent)",1100);
  setTimeout(()=>{ if(running) newTarget(true); },170);
}
function wrong(){
  noteMissed(answerKey(target));
  streak=0; setStats();
  const pp=el("paper"); pp.classList.remove("shake"); void pp.offsetWidth; pp.classList.add("shake");
  showMsg("不正解","var(--ng)",650);
}

function startGame(){
  if(running){ endGame(); return; }
  buildPools(); prev=null; prevKey=null;
  score=0; streak=0; setStats(); running=true;
  clearTimeout(msgId);
  el("feedback").textContent=""; el("weak").innerHTML=""; el("startBtn").textContent="中断";
  if(method==="piano") buildPiano();
  if(sfxVol>0 && method!=="mic"){ const c=ensureSfx(); if(c&&c.state==="suspended") c.resume(); }
  cancelAnimationFrame(rafTimer);
  el("timerbar").style.visibility = timeLimit>0 ? "visible" : "hidden";
  el("timerFill").style.transform="scaleX(1)";
  startTs=Date.now(); if(timeLimit>0) tickTimer();
  newTarget(true);
  if(method==="mic") startMic();
}
function endGame(){
  running=false; cancelAnimationFrame(rafTimer); stopMic();
  el("startBtn").textContent="開始";
  el("timerbar").style.visibility="hidden";
  clearTimeout(msgId);
  el("feedback").textContent=`終了　正解 ${score} 問`;
  el("feedback").style.color="var(--accent)";
  renderWeak();
}

/* ---------- 正解時の和音（Karplus-Strong による撥弦の合成） ----------
   弦をはじいた音は「短いノイズを、弦を1往復する時間だけ遅らせて平均しながら足し戻す」と作れる。
   平均のぶんだけ高い倍音から先に減るので、ハープや撥弦楽器に近い減衰になる。            */
let sfx=null, sfxOut=null;
let sfxVol=45;
try{ const v=localStorage.getItem("gakufuTrainer.vol.v1"); if(v!==null) sfxVol=parseInt(v,10)||0; }catch(e){}
function ensureSfx(){
  if(sfx) return sfx;
  try{
    sfx=new (window.AudioContext||window.webkitAudioContext)();
    const lp=sfx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=5200; lp.Q.value=0.4;
    const hp=sfx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=70;
    sfxOut=sfx.createGain(); sfxOut.gain.value=1;
    sfxOut.connect(lp); lp.connect(hp); hp.connect(sfx.destination);
  }catch(e){ sfx=null; }
  return sfx;
}
const midiFreq=m=>440*Math.pow(2,(m-69)/12);
function pluckBuffer(ctx,freq,dur,damp){
  const sr=ctx.sampleRate, len=Math.ceil(sr*dur);
  /* 遅延の長さを整数に丸めると高い音ほど音程がずれるので、小数ぶんは2点補間で埋める。
     平均フィルタ自体が0.5サンプル遅れるため、その分を引いた D を目標の遅延にする。 */
  const D=Math.max(2.5, sr/freq-0.5), N=Math.floor(D), f=D-N;
  const buf=ctx.createBuffer(1,len,sr), d=buf.getChannelData(0);
  let last=0;                                   // 励振のノイズは鈍らせる（生のままだと硬い音になる）
  for(let i=0;i<=N+1&&i<len;i++){ last=last*0.6+(Math.random()*2-1)*0.4; d[i]=last; }
  for(let i=N+2;i<len;i++)
    d[i]=damp*0.5*((1-f)*(d[i-N]+d[i-N-1]) + f*(d[i-N-1]+d[i-N-2]));
  for(let i=0;i<len;i++) d[i]*=Math.pow(1-i/len,1.6);   // 最後まで鳴らしきらずに収める
  return buf;
}
/* 出題された音をルートにした長三和音を、下から順にずらして鳴らす（ハープの分散和音） */
function playChord(midi){
  if(method==="mic" || sfxVol<=0) return;       // マイク入力のときは自分の楽器の音と混ざるので鳴らさない
  const ctx=ensureSfx(); if(!ctx) return;
  if(ctx.state==="suspended") ctx.resume();
  const low = midi<52;
  const voices = low ? [0,12,16,19] : [0,4,7,12];   // 低い音は開離配置にして濁らせない
  const t0=ctx.currentTime+0.01, amp=(sfxVol/100)*0.42;
  voices.forEach((iv,k)=>{
    const f=midiFreq(midi+iv);
    const src=ctx.createBufferSource();
    src.buffer=pluckBuffer(ctx,f,1.7,0.9965);
    const g=ctx.createGain(); g.gain.value=amp*(k===0?1:0.66);
    src.connect(g); g.connect(sfxOut);
    src.start(t0+k*0.038);                      // 38msずつずらして分散和音にする
    src.stop(t0+k*0.038+1.75);
  });
}
function setVol(v){
  sfxVol=Math.max(0,Math.min(100,v|0));
  el("volVal").textContent = sfxVol===0 ? "消音" : sfxVol;
  try{ localStorage.setItem("gakufuTrainer.vol.v1",sfxVol); }catch(e){}
}

/* ---------- 苦手音の表示 ---------- */
function labelOfKey(k){
  const [clef,kind,val]=k.split("|");
  const c=(clef==="treble"?"ト音":"ヘ音");
  if(kind==="n") return c+" "+PC_TO_SOLFEGE[+val];
  const i=midiInfo(+val); return c+" "+i.solfege+i.octave;
}
function renderWeak(){
  const rows=Object.entries(miss).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const w=el("weak");
  if(!rows.length){ w.innerHTML=""; return; }
  w.innerHTML='<span class="lb">苦手な音</span>'
    +rows.map(([k,v])=>'<span class="chip'+(v>=3?" hot":"")+'">'+labelOfKey(k)+'</span>').join("")
    +'<button id="weakReset">記録を消去</button>';
  el("weakReset").addEventListener("click",()=>{ miss={}; saveMiss(); renderWeak(); });
}

/* ---------- 音名ボタン ---------- */
el("namePanel").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!running||method!=="name") return;
  const pc=(((target.midi%12)+12)%12);
  if(parseInt(b.dataset.note,10)===pc) correct(); else wrong();
});

/* ---------- 画面の鍵盤 ---------- */
function buildPiano(){
  if(!combined.length) return;
  // 鍵盤の左右の端＝出題プールの最低音・最高音（余分な鍵を出さない）
  const min=Math.min(...combined.map(o=>o.midi)), max=Math.max(...combined.map(o=>o.midi));
  const whites=[]; for(let m=min;m<=max;m++) if(isNatural(m)) whites.push(m);
  const W=42, BW=26, piano=el("piano"); piano.innerHTML="";
  piano.style.width=(whites.length*W)+"px";
  whites.forEach((m,idx)=>{
    const info=midiInfo(m);
    const w=document.createElement("div"); w.className="wkey"; w.style.left=(idx*W)+"px";
    w.dataset.note=m; if(info.pc===0) w.textContent="C"+info.octave;
    piano.appendChild(w);
    const pc=info.pc;
    if([0,2,5,7,9].includes(pc) && idx<whites.length-1){
      const b=document.createElement("div"); b.className="bkey";
      b.style.left=(idx*W+W-BW/2)+"px"; b.dataset.note=m+1; piano.appendChild(b);
    }
  });
  pianoScroll.scrollLeft=0;
  syncKb();
}
el("piano").addEventListener("click",e=>{
  const k=e.target.closest(".wkey,.bkey"); if(!k||!running||method!=="piano") return;
  if(parseInt(k.dataset.note,10)===target.midi) correct(); else wrong();
});
/* 鍵盤スクロール用スライダー（鍵に触れず左右移動） */
const pianoScroll=el("pianoScroll"), kbScroll=el("kbScroll");
function syncKb(){ const max=pianoScroll.scrollWidth-pianoScroll.clientWidth;
  if(max<=2){ kbScroll.style.display="none"; document.querySelector(".kbcap").style.display="none"; }
  else { kbScroll.style.display=""; document.querySelector(".kbcap").style.display="";
    kbScroll.value = pianoScroll.scrollLeft/max*100; } }
kbScroll.addEventListener("input",()=>{ const max=pianoScroll.scrollWidth-pianoScroll.clientWidth;
  pianoScroll.scrollLeft = kbScroll.value/100*max; });
pianoScroll.addEventListener("scroll",syncKb);
window.addEventListener("resize",syncKb);

/* ---------- マイク（自己相関ピッチ検出） ---------- */
let audioCtx=null,analyser=null,micStream=null,rafId=null,buf=null,lastMidi=null,stable=0;
async function startMic(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
    buf=new Float32Array(analyser.fftSize);
    el("listenMsg").textContent="音を検出しています。表示された音符を演奏してください。"; detectLoop();
  }catch(err){ el("listenMsg").textContent="マイクを使用できません（"+err.message+"）。https または http://localhost で開いてください。"; }
}
function stopMic(){
  if(rafId) cancelAnimationFrame(rafId);
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  if(audioCtx){ audioCtx.close(); audioCtx=null; }
}
function autoCorrelate(b,sr){
  let SIZE=b.length,rms=0; for(let i=0;i<SIZE;i++) rms+=b[i]*b[i]; rms=Math.sqrt(rms/SIZE);
  if(rms<0.01) return -1;
  let r1=0,r2=SIZE-1,th=0.2;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(b[i])<th){r1=i;break;}
  for(let i=1;i<SIZE/2;i++) if(Math.abs(b[SIZE-i])<th){r2=SIZE-i;break;}
  b=b.slice(r1,r2); SIZE=b.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE-i;j++) c[i]+=b[j]*b[j+i];
  let d=0; while(c[d]>c[d+1]) d++;
  let maxv=-1,maxp=-1; for(let i=d;i<SIZE;i++) if(c[i]>maxv){maxv=c[i];maxp=i;}
  let T0=maxp; const x1=c[T0-1],x2=c[T0],x3=c[T0+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  if(a) T0=T0-bb/(2*a);
  return sr/T0;
}
const freqToMidi=f=>Math.round(69+12*Math.log2(f/440));
const midiName=m=>{const i=midiInfo(m);return i.solfege+" ("+i.letter+i.octave+")";};
function detectLoop(){
  if(!running||method!=="mic") return;
  analyser.getFloatTimeDomainData(buf);
  const f=autoCorrelate(buf,audioCtx.sampleRate);
  if(f>0){ const m=freqToMidi(f);
    if(m>=33&&m<=96){
      el("detected").textContent=midiName(m);
      if(m===lastMidi) stable++; else {lastMidi=m; stable=0;}
      if(stable===3 && m===target.midi){ stable=-99; correct(); lastMidi=null; }
    }
  }
  rafId=requestAnimationFrame(detectLoop);
}

/* ---------- セレクタ ---------- */
function segHandler(segId,setter){
  el(segId).addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove("on")); b.classList.add("on");
    setter(b.dataset); if(running) endGame();
  });
}
/* 設定を変えたら、スタート前でも出題プール・山札・鍵盤を作り直して今の設定を反映する */
function refreshSetup(){ buildPools(); if(method==="piano") buildPiano(); }
segHandler("methodSeg",d=>{ method=d.m;
  el("namePanel").classList.toggle("hidden",method!=="name");
  el("pianoPanel").classList.toggle("hidden",method!=="piano");
  el("micPanel").classList.toggle("hidden",method!=="mic");
  updateHint(); refreshSetup();
});
segHandler("clefSeg",d=>{ clefMode=d.c; refreshSetup(); });
segHandler("rangeSeg",d=>{ rangeMode=d.r; refreshSetup(); });
segHandler("timeSeg",d=>{ timeLimit=parseInt(d.t,10); });
segHandler("focusSeg",d=>{ focusWeak=(d.f==="on"); refreshSetup(); });
el("vol").addEventListener("input",e=>setVol(parseInt(e.target.value,10)));
function updateHint(){
  const map={
    name:"表示された音符の<b>音名</b>を選びます。オクターブは問いません。読む速度を上げる練習に向いています。",
    piano:"表示された音符と<b>同じ高さの鍵盤</b>を選びます（オクターブも一致させてください）。Cの鍵盤に音名を表示しています。",
    mic:"表示された音符を実際の楽器で演奏し、マイクで判定します。※<b>https</b> または <b>http://localhost</b> で開いた場合のみ利用できます。"
  };
  el("hint").innerHTML="<p>"+map[method]+"</p><p>出題は<b>すべての音が一巡するまで重複しない</b>方式です。苦手音の出題を「重点的に」にすると、間違えた音が一巡あたり2〜3回出題され、正解を重ねると通常の頻度に戻ります。苦手音の記録はこの端末に保存されます。</p><p>正解すると、その音をルートにした和音が鳴ります（音量はオプションで調整でき、0にすると消音）。マイク入力のときは自分の楽器の音と混ざるため鳴りません。</p>";
}

/* ---------- init ---------- */
el("startBtn").addEventListener("click",startGame);
el("vol").value=sfxVol; setVol(sfxVol);
drawStaff("treble"); updateHint(); setStats(); renderWeak();
</script>
</body>
</html>
