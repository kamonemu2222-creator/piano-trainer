<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>楽譜トレーナー</title>
<style>
  :root{
    --bg:#12131a; --panel:#1e2030; --accent:#7c9cff; --accent2:#ff9ecb;
    --ok:#5ee6a0; --ng:#ff6b7a; --text:#eef0ff; --muted:#9aa0c0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN",system-ui,sans-serif;
       background:var(--bg); color:var(--text); text-align:center; padding:12px; user-select:none;}
  h1{font-size:20px; margin:6px 0 10px; letter-spacing:.04em;}
  .card{background:var(--panel); border-radius:16px; padding:14px; margin:0 auto 12px; max-width:560px;
        box-shadow:0 6px 24px rgba(0,0,0,.35);}
  .ctrls{display:grid; gap:8px;}
  .ctrlrow{display:flex; gap:8px; justify-content:center; align-items:center; flex-wrap:wrap;}
  .lbl{font-size:11px; color:var(--muted); width:52px; text-align:right;}
  .seg{display:inline-flex; background:#0d0e16; border-radius:12px; padding:4px; flex-wrap:wrap;}
  .seg button{background:transparent; color:var(--muted); border:0; padding:8px 12px; border-radius:9px;
              font-size:13px; font-weight:600;}
  .seg button.on{background:var(--accent); color:#0d0e16;}
  .bigbtn{background:var(--accent2); color:#1a0e16; border:0; border-radius:12px; padding:12px 22px;
          font-size:16px; font-weight:800; margin-top:8px;}
  .stats{display:flex; justify-content:space-around; margin:10px 0 2px; font-variant-numeric:tabular-nums;}
  .stats div span{display:block; font-size:22px; font-weight:800;}
  .stats div small{color:var(--muted); font-size:11px;}
  svg{display:block; margin:6px auto; width:100%; max-width:440px; height:210px;}
  .cap{font-size:12px; color:var(--muted); margin-top:-4px;}
  .feedback{height:26px; font-size:18px; font-weight:800; margin:4px;}
  .keys{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; max-width:560px; margin:0 auto;}
  .keys button{padding:16px 0; font-size:18px; font-weight:800; border:0; border-radius:12px;
               background:#2a2d44; color:var(--text);}
  .keys button small{display:block; font-size:11px; color:var(--muted); font-weight:600;}
  .keys button:active{background:var(--accent); color:#0d0e16;}
  /* piano */
  .pianoWrap{overflow-x:auto; padding:6px 0;}
  .piano{position:relative; height:150px; margin:0 auto; display:inline-block;}
  .wkey{position:absolute; top:0; width:42px; height:150px; background:#f3f4ff; border:1px solid #3a3d55;
        border-radius:0 0 6px 6px; color:#556; font-size:10px; display:flex; align-items:flex-end;
        justify-content:center; padding-bottom:6px; font-weight:700;}
  .wkey:active{background:var(--accent);}
  .bkey{position:absolute; top:0; width:26px; height:95px; background:#181a26; border:1px solid #000;
        border-radius:0 0 5px 5px; z-index:2;}
  .bkey:active{background:var(--accent);}
  .kbscroll{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:460px;height:12px;border-radius:7px;background:#2a2d44;margin:12px auto 2px;}
  .kbscroll::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:30px;border-radius:9px;background:var(--accent);border:2px solid #0d0e16;}
  .kbscroll::-moz-range-thumb{width:52px;height:30px;border-radius:9px;background:var(--accent);border:2px solid #0d0e16;}
  .kbcap{font-size:11px;color:var(--muted);}
  .listen{font-size:14px; color:var(--muted); min-height:24px;}
  .detected{font-size:26px; font-weight:800; color:var(--accent);}
  .hidden{display:none;}
  .hint{color:var(--muted); font-size:12px; line-height:1.5; max-width:560px; margin:8px auto;}
</style>
</head>
<body>
<h1>🎹 楽譜トレーナー</h1>
<div style="font-size:12px;margin-bottom:10px;"><a href="phrase.html" style="color:#7c9cff;">🎼 曲れんしゅう（PCキーボードで弾く）へ →</a></div>

<div class="card">
  <div class="ctrls">
    <div class="ctrlrow"><span class="lbl">こたえ方</span>
      <div class="seg" id="methodSeg">
        <button data-m="name" class="on">音名ボタン</button>
        <button data-m="piano">画面の鍵盤</button>
        <button data-m="mic">マイクで演奏</button>
      </div>
    </div>
    <div class="ctrlrow"><span class="lbl">記号</span>
      <div class="seg" id="clefSeg">
        <button data-c="treble" class="on">ト音</button>
        <button data-c="bass">ヘ音</button>
        <button data-c="both">混合</button>
      </div>
    </div>
    <div class="ctrlrow"><span class="lbl">範囲</span>
      <div class="seg" id="rangeSeg">
        <button data-r="narrow" class="on">せまい(1オクターブ)</button>
        <button data-r="wide">ひろい</button>
      </div>
    </div>
  </div>
  <div class="stats">
    <div><span id="score">0</span><small>せいかい</small></div>
    <div><span id="streak">0</span><small>れんぞく⭐</small></div>
    <div><span id="time">60</span><small>のこり秒</small></div>
  </div>
  <button class="bigbtn" id="startBtn">スタート</button>
</div>

<div class="card">
  <svg id="staff" viewBox="0 0 440 210" aria-label="staff"></svg>
  <div class="cap" id="clefCap"></div>
  <div class="feedback" id="feedback"></div>

  <div id="namePanel" class="keys">
    <button data-note="0">ド<small>C</small></button>
    <button data-note="2">レ<small>D</small></button>
    <button data-note="4">ミ<small>E</small></button>
    <button data-note="5">ファ<small>F</small></button>
    <button data-note="7">ソ<small>G</small></button>
    <button data-note="9">ラ<small>A</small></button>
    <button data-note="11">シ<small>B</small></button>
  </div>

  <div id="pianoPanel" class="hidden">
    <div class="pianoWrap" id="pianoScroll"><div class="piano" id="piano"></div></div>
    <div class="kbcap">← 鍵盤を左右にスクロール →</div>
    <input type="range" id="kbScroll" class="kbscroll" min="0" max="100" value="0" aria-label="鍵盤をスクロール">
  </div>

  <div id="micPanel" class="hidden">
    <div class="listen" id="listenMsg">スタートでマイク許可 → 表示の音符を鍵盤で弾いてください。</div>
    <div class="detected" id="detected">—</div>
  </div>
</div>

<div class="hint" id="hint"></div>

<script>
/* ---------- 音符データ ---------- */
const PC_TO_LETTER={0:"C",2:"D",4:"E",5:"F",7:"G",9:"A",11:"B"};
const PC_TO_SOLFEGE={0:"ド",2:"レ",4:"ミ",5:"ファ",7:"ソ",9:"ラ",11:"シ"};
const LETTER_INDEX={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
const isNatural=m=>PC_TO_LETTER[((m%12)+12)%12]!==undefined;

function midiInfo(m){
  const pc=((m%12)+12)%12, octave=Math.floor(m/12)-1, letter=PC_TO_LETTER[pc];
  const diatonic=letter!==undefined ? octave*7+LETTER_INDEX[letter] : null;
  return {midi:m,pc,octave,letter,diatonic,solfege:PC_TO_SOLFEGE[pc]};
}
// 各記号ごとの「一番下の線」の音（diatonic基準）
const CLEF_BOTTOM={treble:4*7+LETTER_INDEX.E /*E4=30*/, bass:2*7+LETTER_INDEX.G /*G2=18*/};
const CLEF_GLYPH={treble:"𝄞", bass:"𝄢"};
const CLEF_NAME ={treble:"ト音記号", bass:"ヘ音記号"};

// 記号×範囲ごとの出題プール（ナチュラルのみ）
const RANGE_MIDI={
  treble:{narrow:[60,72], wide:[60,84]},   // C4–C5 / C4–C6
  bass:  {narrow:[48,60], wide:[36,60]},   // C3–C4 / C2–C4
};
function naturals(lo,hi){ const a=[]; for(let m=lo;m<=hi;m++) if(isNatural(m)) a.push(m); return a; }

/* ---------- 五線描画 ---------- */
const NS="http://www.w3.org/2000/svg", staff=document.getElementById("staff");
const LINE_GAP=16, X_LEFT=44, X_RIGHT=420, X_NOTE=250, Y_BOTTOM=120;
function clearSvg(){ while(staff.firstChild) staff.removeChild(staff.firstChild); }
function line(x1,y1,x2,y2,w=1.6,color="#cfd4ff"){
  const l=document.createElementNS(NS,"line");
  l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
  l.setAttribute("stroke",color);l.setAttribute("stroke-width",w);staff.appendChild(l);
}
const yForSteps=s=>Y_BOTTOM-s*(LINE_GAP/2);
function drawStaff(clef){
  clearSvg();
  for(let i=0;i<5;i++) line(X_LEFT,Y_BOTTOM-i*LINE_GAP,X_RIGHT,Y_BOTTOM-i*LINE_GAP);
  const g=document.createElementNS(NS,"text");
  g.setAttribute("x",X_LEFT+2);
  g.setAttribute("y", clef==="treble"?Y_BOTTOM+8:Y_BOTTOM-1.4*LINE_GAP);
  g.setAttribute("font-size", clef==="treble"?"72":"48");
  g.setAttribute("fill","#cfd4ff"); g.textContent=CLEF_GLYPH[clef]; staff.appendChild(g);
}
function drawNote(m,clef){
  drawStaff(clef);
  const steps=midiInfo(m).diatonic - CLEF_BOTTOM[clef];
  const y=yForSteps(steps);
  for(let s=-2;s>=steps;s-=2) line(X_NOTE-16,yForSteps(s),X_NOTE+16,yForSteps(s),1.6);
  for(let s=10;s<=steps;s+=2) line(X_NOTE-16,yForSteps(s),X_NOTE+16,yForSteps(s),1.6);
  const head=document.createElementNS(NS,"ellipse");
  head.setAttribute("cx",X_NOTE);head.setAttribute("cy",y);head.setAttribute("rx",11);head.setAttribute("ry",8);
  head.setAttribute("transform",`rotate(-20 ${X_NOTE} ${y})`);head.setAttribute("fill","#fff");staff.appendChild(head);
  const up=steps<4, sx=up?X_NOTE+10:X_NOTE-10, sy2=up?y-52:y+52;
  line(sx,y,sx,sy2,2.2,"#fff");
}

/* ---------- 状態 ---------- */
let method="name", clefMode="treble", rangeMode="narrow";
let combined=[], target=null, prev=null;
let running=false, score=0, streak=0, timeLeft=60, timerId=null;
const el=id=>document.getElementById(id);
const setStats=()=>{el("score").textContent=score;el("streak").textContent=streak;el("time").textContent=timeLeft;};

function buildPools(){
  const clefs = clefMode==="both" ? ["treble","bass"] : [clefMode];
  combined=[];
  clefs.forEach(c=>{
    const [lo,hi]=RANGE_MIDI[c][rangeMode];
    naturals(lo,hi).forEach(m=>combined.push({midi:m, clef:c, diatonic:midiInfo(m).diatonic}));
  });
}

/* 同じ音・隣接する音を連続で出さない */
function pickTarget(){
  let cand, tries=0;
  do{
    cand=combined[Math.floor(Math.random()*combined.length)]; tries++;
    if(tries>50) break;
  }while(prev && cand.clef===prev.clef && Math.abs(cand.diatonic-prev.diatonic)<2);
  prev=cand; return cand;
}
function newTarget(){
  target=pickTarget();
  drawNote(target.midi,target.clef);
  el("clefCap").textContent=CLEF_NAME[target.clef];
  if(method==="mic") el("detected").textContent="—";
}

function correct(){
  score++; streak++; setStats();
  el("feedback").textContent="⭐ せいかい！"; el("feedback").style.color="var(--ok)";
  setTimeout(()=>{ el("feedback").textContent=""; if(running) newTarget(); },500);
}
function wrong(){
  streak=0; setStats();
  el("feedback").textContent="ちがうよ"; el("feedback").style.color="var(--ng)";
  setTimeout(()=>{ el("feedback").textContent=""; },500);
}

function startGame(){
  buildPools(); prev=null;
  score=0; streak=0; timeLeft=60; setStats(); running=true; el("feedback").textContent="";
  if(method==="piano") buildPiano();
  clearInterval(timerId);
  timerId=setInterval(()=>{ timeLeft--; setStats(); if(timeLeft<=0) endGame(); },1000);
  newTarget();
  if(method==="mic") startMic();
}
function endGame(){
  running=false; clearInterval(timerId); stopMic();
  el("feedback").textContent=`しゅうりょう！ せいかい ${score}こ 🎉`;
  el("feedback").style.color="var(--accent2)";
}

/* ---------- 音名ボタン ---------- */
el("namePanel").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!running||method!=="name") return;
  const pc=(((target.midi%12)+12)%12);
  if(parseInt(b.dataset.note,10)===pc) correct(); else wrong();
});

/* ---------- 画面の鍵盤 ---------- */
function buildPiano(){
  const min=Math.min(...combined.map(o=>o.midi)), max=Math.max(...combined.map(o=>o.midi));
  const lowC=Math.floor(min/12)*12, highC=Math.ceil((max+1)/12)*12;
  const whites=[]; for(let m=lowC;m<=highC;m++) if(isNatural(m)) whites.push(m);
  const W=42, BW=26, piano=el("piano"); piano.innerHTML="";
  piano.style.width=(whites.length*W)+"px";
  whites.forEach((m,idx)=>{
    const info=midiInfo(m);
    const w=document.createElement("div"); w.className="wkey"; w.style.left=(idx*W)+"px";
    w.dataset.note=m; if(info.pc===0) w.textContent="C"+info.octave;
    piano.appendChild(w);
    const pc=info.pc;
    if([0,2,5,7,9].includes(pc) && idx<whites.length-1){
      const b=document.createElement("div"); b.className="bkey";
      b.style.left=(idx*W+W-BW/2)+"px"; b.dataset.note=m+1; piano.appendChild(b);
    }
  });
  syncKb();
}
el("piano").addEventListener("click",e=>{
  const k=e.target.closest(".wkey,.bkey"); if(!k||!running||method!=="piano") return;
  if(parseInt(k.dataset.note,10)===target.midi) correct(); else wrong();
});
/* 鍵盤スクロール用スライダー（鍵に触れず左右移動） */
const pianoScroll=el("pianoScroll"), kbScroll=el("kbScroll");
function syncKb(){ const max=pianoScroll.scrollWidth-pianoScroll.clientWidth;
  if(max<=2){ kbScroll.style.display="none"; document.querySelector(".kbcap").style.display="none"; }
  else { kbScroll.style.display=""; document.querySelector(".kbcap").style.display="";
    kbScroll.value = pianoScroll.scrollLeft/max*100; } }
kbScroll.addEventListener("input",()=>{ const max=pianoScroll.scrollWidth-pianoScroll.clientWidth;
  pianoScroll.scrollLeft = kbScroll.value/100*max; });
pianoScroll.addEventListener("scroll",syncKb);
window.addEventListener("resize",syncKb);

/* ---------- マイク（自己相関ピッチ検出） ---------- */
let audioCtx=null,analyser=null,micStream=null,rafId=null,buf=null,lastMidi=null,stable=0;
async function startMic(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=2048; src.connect(analyser);
    buf=new Float32Array(analyser.fftSize);
    el("listenMsg").textContent="🎤 聞いてます… 音符の音を弾いてね"; detectLoop();
  }catch(err){ el("listenMsg").textContent="マイク不可: "+err.message+"（http://localhost かhttpsで開いてください）"; }
}
function stopMic(){
  if(rafId) cancelAnimationFrame(rafId);
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  if(audioCtx){ audioCtx.close(); audioCtx=null; }
}
function autoCorrelate(b,sr){
  let SIZE=b.length,rms=0; for(let i=0;i<SIZE;i++) rms+=b[i]*b[i]; rms=Math.sqrt(rms/SIZE);
  if(rms<0.01) return -1;
  let r1=0,r2=SIZE-1,th=0.2;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(b[i])<th){r1=i;break;}
  for(let i=1;i<SIZE/2;i++) if(Math.abs(b[SIZE-i])<th){r2=SIZE-i;break;}
  b=b.slice(r1,r2); SIZE=b.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE-i;j++) c[i]+=b[j]*b[j+i];
  let d=0; while(c[d]>c[d+1]) d++;
  let maxv=-1,maxp=-1; for(let i=d;i<SIZE;i++) if(c[i]>maxv){maxv=c[i];maxp=i;}
  let T0=maxp; const x1=c[T0-1],x2=c[T0],x3=c[T0+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  if(a) T0=T0-bb/(2*a);
  return sr/T0;
}
const freqToMidi=f=>Math.round(69+12*Math.log2(f/440));
const midiName=m=>{const i=midiInfo(m);return i.solfege+" ("+i.letter+i.octave+")";};
function detectLoop(){
  if(!running||method!=="mic") return;
  analyser.getFloatTimeDomainData(buf);
  const f=autoCorrelate(buf,audioCtx.sampleRate);
  if(f>0){ const m=freqToMidi(f);
    if(m>=33&&m<=96){
      el("detected").textContent=midiName(m);
      if(m===lastMidi) stable++; else {lastMidi=m; stable=0;}
      if(stable===3 && m===target.midi){ stable=-99; correct(); lastMidi=null; }
    }
  }
  rafId=requestAnimationFrame(detectLoop);
}

/* ---------- セレクタ ---------- */
function segHandler(segId,setter){
  el(segId).addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove("on")); b.classList.add("on");
    setter(b.dataset); if(running) endGame();
  });
}
segHandler("methodSeg",d=>{ method=d.m;
  el("namePanel").classList.toggle("hidden",method!=="name");
  el("pianoPanel").classList.toggle("hidden",method!=="piano");
  el("micPanel").classList.toggle("hidden",method!=="mic");
  updateHint();
});
segHandler("clefSeg",d=>{ clefMode=d.c; });
segHandler("rangeSeg",d=>{ rangeMode=d.r; });
function updateHint(){
  const map={
    name:"音名ボタン：出た音符が「ドレミ…」のどれかをタップ。オクターブは不問。速読ドリル向き。",
    piano:"画面の鍵盤：出た音符と<b>同じ高さの鍵</b>をタップ（オクターブも合わせる）。左端にドの位置(C4など)を表示。",
    mic:"マイクで演奏：出た音符を PSR-E283 で弾く。マイクが判定。※<b>http://localhost</b> かhttpsで開いたときだけ使えます。"
  };
  el("hint").innerHTML=map[method];
}

/* ---------- init ---------- */
el("startBtn").addEventListener("click",startGame);
drawStaff("treble"); updateHint(); setStats();
</script>
</body>
</html>
