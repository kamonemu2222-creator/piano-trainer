<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曲れんしゅう｜楽譜トレーナー</title>
<style>
  :root{--bg:#12131a;--panel:#1e2030;--accent:#7c9cff;--accent2:#ff9ecb;--ok:#5ee6a0;--ng:#ff6b7a;--text:#eef0ff;--muted:#9aa0c0;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",system-ui,sans-serif;background:var(--bg);color:var(--text);text-align:center;padding:12px;}
  a{color:var(--accent);}
  h1{font-size:20px;margin:4px 0 2px;}
  .nav{font-size:12px;margin-bottom:10px;}
  .card{background:var(--panel);border-radius:16px;padding:14px;margin:0 auto 12px;max-width:640px;box-shadow:0 6px 24px rgba(0,0,0,.35);}
  .row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;}
  select,button.btn{background:#0d0e16;color:var(--text);border:1px solid #333;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;}
  button.btn{background:var(--accent2);color:#1a0e16;border:0;}
  label.vol{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  input[type=range]{width:120px;}
  .toggle{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .scrollx{overflow-x:auto;}
  svg{display:block;margin:6px auto;height:220px;}
  .msg{height:28px;font-size:18px;font-weight:800;margin:4px;}
  /* piano */
  .pianoWrap{overflow-x:auto;padding:6px 0;}
  .piano{position:relative;height:150px;margin:0 auto;display:inline-block;}
  .wkey{position:absolute;top:0;width:46px;height:150px;background:#f3f4ff;border:1px solid #3a3d55;border-radius:0 0 6px 6px;color:#556;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;font-weight:800;}
  .wkey .lo{font-size:9px;color:#889;font-weight:600;}
  .bkey{position:absolute;top:0;width:28px;height:96px;background:#181a26;border:1px solid #000;border-radius:0 0 5px 5px;z-index:2;color:#cfd;font-size:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-weight:700;}
  .wkey.active,.bkey.active{background:var(--accent);color:#0d0e16;}
  .wkey.target{box-shadow:inset 0 0 0 3px var(--accent2);}
  .bkey.target{box-shadow:inset 0 0 0 3px var(--accent2);}
  .hint{color:var(--muted);font-size:12px;line-height:1.6;max-width:640px;margin:8px auto;}
  kbd{background:#0d0e16;border:1px solid #444;border-radius:5px;padding:1px 6px;font-size:12px;}
</style>
</head>
<body>
<h1>🎼 曲れんしゅう</h1>
<div class="nav"><a href="index.html">← 音符クイズにもどる</a></div>

<div class="card">
  <div class="row">
    <select id="tuneSel"></select>
    <button class="btn" id="resetBtn">最初から</button>
    <label class="toggle"><input type="checkbox" id="allFinger"> 指番号ぜんぶ</label>
    <label class="toggle"><input type="checkbox" id="hintKey" checked> 鍵盤ヒント</label>
    <label class="vol">音量 <input type="range" id="vol" min="0" max="100" value="35"></label>
  </div>
</div>

<div class="card">
  <div class="scrollx" id="staffWrap"><svg id="staff" aria-label="phrase"></svg></div>
  <div class="msg" id="msg">下の鍵盤の文字＝PCのキー。表示された音符を順に弾いてね。</div>
  <div class="pianoWrap"><div class="piano" id="piano"></div></div>
</div>

<div class="hint" id="hint"></div>

<script>
/* ---------- 基本データ ---------- */
const PC_LETTER={0:"C",2:"D",4:"E",5:"F",7:"G",9:"A",11:"B"};
const SOLFEGE={0:"ド",2:"レ",4:"ミ",5:"ファ",7:"ソ",9:"ラ",11:"シ"};
const LETTER_INDEX={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
const isNatural=m=>PC_LETTER[((m%12)+12)%12]!==undefined;
function info(m){const pc=((m%12)+12)%12,oct=Math.floor(m/12)-1;const nat=PC_LETTER[pc];
  const baseLetter=nat!==undefined?nat:PC_LETTER[pc-1];const diatonic=oct*7+LETTER_INDEX[baseLetter];
  return {pc,oct,nat,diatonic,solf:SOLFEGE[pc]};}
const E4=4*7+LETTER_INDEX.E; // 30

/* PCキー → MIDI（C4=60〜E5=76、黒鍵つき） */
const KEYMAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,o:73,l:74,p:75,";":76};
const MIDI2KEY={}; for(const k in KEYMAP) MIDI2KEY[KEYMAP[k]]=k;

/* ---------- 内蔵曲（右手・ト音）小節ごとの配列。各音符=[midi,指番号] ----------
   すべて「ド〜ソ(C4〜G4)の5本指ポジション」に収まる曲。指番号は1〜5で正確。 */
const TUNES={
  "ドレミファソ（5本指れんしゅう）":[
    [[60,1],[62,2],[64,3],[65,4]],[[67,5],[65,4],[64,3],[62,2]],[[60,1]]
  ],
  "ホット・クロス・バンズ":[
    [[64,3],[62,2],[60,1]],[[64,3],[62,2],[60,1]],
    [[60,1],[60,1],[60,1],[60,1]],[[62,2],[62,2],[62,2],[62,2]],
    [[64,3],[62,2],[60,1]]
  ],
  "メリーさんのひつじ":[
    [[64,3],[62,2],[60,1],[62,2]],[[64,3],[64,3],[64,3]],
    [[62,2],[62,2],[62,2]],[[64,3],[67,5],[67,5]],
    [[64,3],[62,2],[60,1],[62,2]],[[64,3],[64,3],[64,3],[64,3]],
    [[62,2],[62,2],[64,3],[62,2]],[[60,1]]
  ],
  "ちょうちょう":[
    [[67,5],[64,3],[64,3]],[[65,4],[62,2],[62,2]],
    [[60,1],[62,2],[64,3],[65,4]],[[67,5],[67,5],[67,5]],
    [[67,5],[64,3],[64,3]],[[65,4],[62,2],[62,2]],
    [[60,1],[64,3],[67,5],[67,5]],[[64,3],[60,1]]
  ],
  "ぶんぶんぶん":[
    [[67,5],[64,3],[64,3]],[[65,4],[62,2],[62,2]],
    [[60,1],[62,2],[64,3],[65,4]],[[67,5],[67,5],[67,5]],
    [[67,5],[64,3],[64,3]],[[65,4],[62,2],[62,2]],
    [[60,1],[64,3],[67,5],[64,3]],[[60,1]]
  ],
  "ジングルベル":[
    [[64,3],[64,3],[64,3]],[[64,3],[64,3],[64,3]],
    [[64,3],[67,5],[60,1],[62,2]],[[64,3]],
    [[65,4],[65,4],[65,4],[65,4]],[[65,4],[64,3],[64,3],[64,3]],
    [[64,3],[62,2],[62,2],[64,3]],[[62,2],[67,5]]
  ],
  "歓びの歌（オード・トゥ・ジョイ）":[
    [[64,3],[64,3],[65,4],[67,5]],[[67,5],[65,4],[64,3],[62,2]],
    [[60,1],[60,1],[62,2],[64,3]],[[64,3],[62,2],[62,2]],
    [[64,3],[64,3],[65,4],[67,5]],[[67,5],[65,4],[64,3],[62,2]],
    [[60,1],[60,1],[62,2],[64,3]],[[62,2],[60,1],[60,1]]
  ],
};

/* ---------- 五線に曲を描く ---------- */
const NS="http://www.w3.org/2000/svg",staff=document.getElementById("staff");
const LINE_GAP=16,Y_BOTTOM=130,X0=72,DX=34,MG=16,Y_FINGER=40;
function mk(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function line(x1,y1,x2,y2,w,c){staff.appendChild(mk("line",{x1,y1,x2,y2,stroke:c||"#cfd4ff","stroke-width":w||1.6}));}
const yFor=s=>Y_BOTTOM-s*(LINE_GAP/2);

let phrase=[], measures=[], idx=0;

function barLine(x,topY,dbl){
  line(x,topY,x,Y_BOTTOM,dbl?2.6:1.4,"#8890b8");
  if(dbl) line(x-4,topY,x-4,Y_BOTTOM,1.2,"#8890b8");
}
function drawPhrase(){
  while(staff.firstChild) staff.removeChild(staff.firstChild);
  const showAll=document.getElementById("allFinger").checked;
  const topY=Y_BOTTOM-4*LINE_GAP;
  let total=X0; measures.forEach(mr=>total+=mr.length*DX+MG);
  const width=total+30;
  staff.setAttribute("viewBox",`0 0 ${width} 220`); staff.setAttribute("width",width);
  for(let i=0;i<5;i++) line(20,Y_BOTTOM-i*LINE_GAP,width-10,Y_BOTTOM-i*LINE_GAP);
  const g=mk("text",{x:24,y:Y_BOTTOM+8,"font-size":72,fill:"#cfd4ff"});g.textContent="𝄞";staff.appendChild(g);

  let x=X0, gi=0, curX=X0;
  measures.forEach((mr,mi)=>{
    mr.forEach(n=>{
      const m=n[0],finger=n[1];
      const steps=info(m).diatonic-E4, y=yFor(steps);
      const color = gi<idx ? "#5ee6a0" : (gi===idx ? "#7c9cff" : "#ffffff");
      if(gi===idx) curX=x;
      for(let s=-2;s>=steps;s-=2) line(x-13,yFor(s),x+13,yFor(s),1.6);
      for(let s=10;s<=steps;s+=2) line(x-13,yFor(s),x+13,yFor(s),1.6);
      staff.appendChild(mk("ellipse",{cx:x,cy:y,rx:10,ry:7.5,transform:`rotate(-20 ${x} ${y})`,fill:color}));
      const up=steps<4,sx=up?x+9:x-9; line(sx,y,sx,up?y-46:y+46,2.2,color);
      if(!info(m).nat){ const sh=mk("text",{x:x-22,y:y+5,"font-size":18,fill:color});sh.textContent="♯";staff.appendChild(sh);}
      const jump = gi>0 && Math.abs(finger-phrase[gi-1][1])>=2;
      if(finger && (gi===0||showAll||jump)){
        const t=mk("text",{x,y:Y_FINGER,"font-size":15,"text-anchor":"middle",fill:gi===idx?"#ff9ecb":"#9aa0c0","font-weight":"700"});
        t.textContent=finger; staff.appendChild(t);
      }
      x+=DX; gi++;
    });
    barLine(x-DX/2, topY, mi===measures.length-1);
    x+=MG;
  });
  const wrap=document.getElementById("staffWrap");
  wrap.scrollLeft = Math.max(0, curX - wrap.clientWidth*0.5);
}

/* ---------- 画面の鍵盤 ---------- */
function buildPiano(){
  const whites=[];for(let m=60;m<=76;m++) if(isNatural(m)) whites.push(m);
  const W=46,BW=28,piano=document.getElementById("piano");piano.innerHTML="";
  piano.style.width=(whites.length*W)+"px";
  whites.forEach((m,i)=>{
    const w=document.createElement("div");w.className="wkey";w.dataset.note=m;w.style.left=(i*W)+"px";
    const key=MIDI2KEY[m];
    w.innerHTML=`<span>${key===";"?"；":key.toUpperCase()}</span><span class="lo">${SOLFEGE[info(m).pc]}</span>`;
    piano.appendChild(w);
    const pc=info(m).pc;
    if([0,2,5,7,9].includes(pc)&&i<whites.length-1){
      const bm=m+1,b=document.createElement("div");b.className="bkey";b.dataset.note=bm;b.style.left=(i*W+W-BW/2)+"px";
      b.textContent=(MIDI2KEY[bm]||"").toUpperCase();piano.appendChild(b);
    }
  });
  refreshTargetHint();
}
function keyEl(m){return document.querySelector(`[data-note="${m}"]`);}
function refreshTargetHint(){
  document.querySelectorAll(".target").forEach(e=>e.classList.remove("target"));
  if(document.getElementById("hintKey").checked && idx<phrase.length){
    const t=keyEl(phrase[idx][0]); if(t) t.classList.add("target");
  }
}

/* ---------- 音（Web Audio） ---------- */
let actx=null,master=null;const voices={};
function ensureAudio(){ if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=document.getElementById("vol").value/100; master.connect(actx.destination);
}
const midiFreq=m=>440*Math.pow(2,(m-69)/12);
function noteOn(m){ ensureAudio(); if(voices[m]) return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type="triangle"; o.frequency.value=midiFreq(m);
  const t=actx.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+0.01);
  o.connect(g); g.connect(master); o.start(); voices[m]={o,g};
}
function noteOff(m){ const v=voices[m]; if(!v) return; const t=actx.currentTime;
  v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value,t);
  v.g.gain.linearRampToValueAtTime(0,t+0.12); v.o.stop(t+0.14); delete voices[m];
}
document.getElementById("vol").addEventListener("input",e=>{ if(master) master.gain.value=e.target.value/100; });

/* ---------- 判定 ---------- */
function judge(m){
  if(idx>=phrase.length) return;
  if(m===phrase[idx][0]){
    idx++; drawPhrase(); refreshTargetHint();
    if(idx>=phrase.length){ setMsg("🎉 クリア！ 全部あってます！","var(--ok)"); }
    else setMsg("いいね！つぎの音へ","var(--ok)");
  } else {
    setMsg("ちがう音。譜面の🔵の音符を弾いてね","var(--ng)");
    const cur=keyEl(phrase[idx][0]); // 正解キーを一瞬ゆらす
  }
}
function setMsg(s,c){const el=document.getElementById("msg");el.textContent=s;el.style.color=c||"var(--text)";}

/* ---------- 入力（PCキーボード） ---------- */
const pressed=new Set();
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase(); if(!(k in KEYMAP)) return; e.preventDefault();
  if(pressed.has(k)) return; pressed.add(k);
  const m=KEYMAP[k]; noteOn(m); const el=keyEl(m); if(el) el.classList.add("active"); judge(m);
});
window.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase(); if(!(k in KEYMAP)) return; pressed.delete(k);
  const m=KEYMAP[k]; noteOff(m); const el=keyEl(m); if(el) el.classList.remove("active");
});
/* 画面鍵盤クリック/タップでも鳴らす＆判定 */
document.getElementById("piano").addEventListener("pointerdown",e=>{
  const k=e.target.closest(".wkey,.bkey"); if(!k) return; const m=+k.dataset.note;
  noteOn(m); k.classList.add("active"); judge(m);
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>
  document.getElementById("piano").addEventListener(ev,e=>{
    const k=e.target.closest(".wkey,.bkey"); if(!k) return; noteOff(+k.dataset.note); k.classList.remove("active");
  }));

/* ---------- 選曲・リセット ---------- */
function loadTune(name){
  measures=TUNES[name].map(mr=>mr.map(n=>n.slice()));
  phrase=measures.flat(); idx=0; drawPhrase(); refreshTargetHint();
  setMsg("スタート地点です。最初の音符から弾いてね","var(--text)"); }
const sel=document.getElementById("tuneSel");
Object.keys(TUNES).forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o);});
sel.addEventListener("change",()=>loadTune(sel.value));
document.getElementById("resetBtn").addEventListener("click",()=>loadTune(sel.value));
document.getElementById("allFinger").addEventListener("change",drawPhrase);
document.getElementById("hintKey").addEventListener("change",refreshTargetHint);

document.getElementById("hint").innerHTML=
  '割り当て：白鍵 <kbd>a</kbd><kbd>s</kbd><kbd>d</kbd><kbd>f</kbd><kbd>g</kbd><kbd>h</kbd><kbd>j</kbd><kbd>k</kbd><kbd>l</kbd><kbd>；</kbd> = ド4〜ミ5、'+
  '黒鍵(♯) は上段 <kbd>w</kbd><kbd>e</kbd><kbd>t</kbd><kbd>y</kbd><kbd>u</kbd><kbd>o</kbd><kbd>p</kbd>。'+
  '譜面の🔵が今弾く音。合えば緑になって次へ進みます（リズムは自由・自分のペースでOK）。';

/* init */
buildPiano(); loadTune(sel.value);
</script>
</body>
</html>
