<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フレーズ練習｜楽譜トレーナー</title>
<style>
  :root{
    --bg:#0e1014; --panel:#161920; --sunken:#11141a; --line:rgba(255,255,255,.085);
    --text:#e9eaef; --muted:#8d92a3; --accent:#c9a962; --accent-ink:#15171c;
    --ok:#7fbd97; --ng:#cf7b78; --paper:#f6f3ea; --ink:#1c1e26;
    --serif:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; padding:22px 14px 44px; background:var(--bg); color:var(--text);
       font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
       text-align:center; -webkit-font-smoothing:antialiased;}
  header{max-width:640px; margin:0 auto 20px;}
  h1{font-family:var(--serif); font-size:25px; font-weight:600; letter-spacing:.2em;
     margin:0 0 8px; text-indent:.2em;}
  .tagline{font-size:10.5px; color:var(--muted); letter-spacing:.2em;}
  .nav{margin-top:14px; font-size:12px;}
  .nav a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:3px;}
  .nav a:hover{color:var(--accent); border-color:var(--accent);}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;
        margin:0 auto 14px; max-width:640px; box-shadow:0 12px 32px rgba(0,0,0,.34);}

  .settings{display:grid; grid-template-columns:1fr 1fr; text-align:left;}
  .settings .full{grid-column:1/-1; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--line);}
  .col{padding:0 20px;}
  .col:first-of-type{padding-left:0;}
  .col:last-of-type{padding-right:0; border-left:1px solid var(--line);}
  .col>h2{font-size:9.5px; letter-spacing:.2em; color:var(--muted); font-weight:600; margin:0 0 14px;}
  .field+.field{margin-top:14px;}
  .field>label{display:block; font-size:11px; color:var(--muted); letter-spacing:.1em; margin-bottom:7px;}

  .selrow{display:flex; gap:8px; flex-wrap:wrap;}
  select{flex:1; min-width:180px; background:var(--sunken); color:var(--text); font-family:inherit;
         border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600;}
  .btn{background:transparent; color:var(--muted); font-family:inherit; border:1px solid var(--line);
       border-radius:10px; padding:9px 16px; font-size:12.5px; font-weight:600; letter-spacing:.06em;}
  .btn:hover{color:var(--text); border-color:var(--accent);}
  .check{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text); margin-bottom:11px;}
  .check:last-child{margin-bottom:0;}
  .check input{accent-color:var(--accent); width:15px; height:15px;}
  input[type=range]{width:100%; max-width:180px; accent-color:var(--accent);}

  .paper{background:var(--paper); border-radius:10px; padding:6px 0;
         box-shadow:inset 0 0 0 1px rgba(0,0,0,.07); overflow:hidden;}
  .scrollx{overflow-x:auto;}
  svg{display:block; margin:0 auto; height:172px;}
  .msg{min-height:24px; font-size:12.5px; font-weight:600; letter-spacing:.08em; margin:14px 0 2px;}

  .pianoWrap{overflow-x:auto; padding:8px 0; margin-top:8px;}
  .piano{position:relative; height:148px; margin:0 auto; display:inline-block;}
  .wkey{position:absolute; top:0; width:46px; height:148px; background:var(--paper); border:1px solid #c6c0b1;
        border-radius:0 0 5px 5px; color:#57534a; font-size:11px; display:flex; flex-direction:column;
        justify-content:flex-end; align-items:center; padding-bottom:7px; font-weight:700;}
  .wkey .lo{font-size:9px; color:#9a9486; font-weight:600; margin-top:2px;}
  .bkey{position:absolute; top:0; width:28px; height:94px; background:#1c1e26; border:1px solid #07080b;
        border-radius:0 0 4px 4px; z-index:2; color:#b9b3a4; font-size:10px; display:flex;
        align-items:flex-end; justify-content:center; padding-bottom:6px; font-weight:700;}
  .wkey.active,.bkey.active{background:var(--accent); color:var(--accent-ink);}
  .wkey.target{box-shadow:inset 0 0 0 3px var(--accent);}
  .bkey.target{box-shadow:inset 0 0 0 2px var(--accent);}
  .kbscroll{-webkit-appearance:none; appearance:none; display:block; width:100%; max-width:480px;
            height:6px; border-radius:3px; background:var(--sunken); border:1px solid var(--line);
            margin:10px auto 2px;}
  .kbscroll::-webkit-slider-thumb{-webkit-appearance:none; width:56px; height:22px; border-radius:11px;
            background:var(--accent); border:2px solid var(--panel);}
  .kbscroll::-moz-range-thumb{width:56px; height:22px; border-radius:11px;
            background:var(--accent); border:2px solid var(--panel);}
  .kbcap{font-size:10.5px; color:var(--muted); letter-spacing:.1em; margin-top:4px;}

  .hint{max-width:640px; margin:18px auto 0; color:var(--muted); font-size:11.5px;
        line-height:2.1; text-align:left;}
  .hint b{color:var(--text); font-weight:600;}
  kbd{background:var(--sunken); border:1px solid var(--line); border-radius:5px;
      padding:2px 7px; font-size:11px; margin:0 1px; color:var(--text);}

  @media(max-width:540px){
    .settings{grid-template-columns:1fr;}
    .col{padding:0;}
    .col:last-of-type{border-left:0; border-top:1px solid var(--line); margin-top:18px; padding-top:18px;}
  }
</style>
</head>
<body>
<header>
  <h1>フレーズ練習</h1>
  <div class="tagline">PHRASE PRACTICE</div>
  <div class="nav"><a href="index.html">音符クイズへ戻る</a></div>
</header>

<div class="card">
  <div class="settings">
    <div class="full field">
      <label>曲</label>
      <div class="selrow">
        <select id="tuneSel"></select>
        <button class="btn" id="resetBtn">最初から</button>
      </div>
    </div>
    <div class="col">
      <h2>表示</h2>
      <label class="check"><input type="checkbox" id="allFinger">指番号をすべて表示</label>
      <label class="check"><input type="checkbox" id="hintKey" checked>次に弾く鍵盤を示す</label>
    </div>
    <div class="col">
      <h2>音</h2>
      <div class="field">
        <label>音量</label>
        <input type="range" id="vol" min="0" max="100" value="35">
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="paper"><div class="scrollx" id="staffWrap"><svg id="staff" aria-label="phrase"></svg></div></div>
  <div class="msg" id="msg">鍵盤に書かれた文字がPCのキーです。表示された音符を順に演奏してください。</div>
  <div class="pianoWrap" id="pianoScroll"><div class="piano" id="piano"></div></div>
  <input type="range" id="kbScroll" class="kbscroll" min="0" max="100" value="0" aria-label="鍵盤をスクロール">
  <div class="kbcap">鍵盤は左右にスクロールできます</div>
</div>

<div class="hint" id="hint"></div>

<script>
/* ---------- 基本データ ---------- */
const PC_LETTER={0:"C",2:"D",4:"E",5:"F",7:"G",9:"A",11:"B"};
const SOLFEGE={0:"ド",2:"レ",4:"ミ",5:"ファ",7:"ソ",9:"ラ",11:"シ"};
const LETTER_INDEX={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
const isNatural=m=>PC_LETTER[((m%12)+12)%12]!==undefined;
function info(m){const pc=((m%12)+12)%12,oct=Math.floor(m/12)-1;const nat=PC_LETTER[pc];
  const baseLetter=nat!==undefined?nat:PC_LETTER[pc-1];const diatonic=oct*7+LETTER_INDEX[baseLetter];
  return {pc,oct,nat,diatonic,solf:SOLFEGE[pc]};}
const E4=4*7+LETTER_INDEX.E; // 30

/* PCキー → MIDI（C4=60〜E5=76、黒鍵つき） */
const KEYMAP={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72,o:73,l:74,p:75,";":76};
const MIDI2KEY={}; for(const k in KEYMAP) MIDI2KEY[KEYMAP[k]]=k;

/* ---------- 内蔵曲（右手・ト音）小節ごとの配列。各音符=[midi,指番号] ----------
   すべて「ド〜ソ(C4〜G4)の5本指ポジション」に収まる曲。指番号は1〜5で正確。 */
const TUNES={
  "ドレミファソ（5指ポジションの練習）":[
    [[60,1],[62,2],[64,3],[65,4]],[[67,5],[65,4],[64,3],[62,2]],[[60,1]]
  ],
  "ホット・クロス・バンズ":[
    [[64,3],[62,2],[60,1]],[[64,3],[62,2],[60,1]],
    [[60,1],[60,1],[60,1],[60,1]],[[62,2],[62,2],[62,2],[62,2]],
    [[64,3],[62,2],[60,1]]
  ],
  "メリーさんのひつじ":[
    [[64,3],[62,2],[60,1],[62,2]],[[64,3],[64,3],[64,3]],
    [[62,2],[62,2],[62,2]],[[64,3],[67,5],[67,5]],
    [[64,3],[62,2],[60,1],[62,2]],[[64,3],[64,3],[64,3],[64,3]],
    [[62,2],[62,2],[64,3],[62,2]],[[60,1]]
  ],
  "ちょうちょう":[
    [[67,5],[64,3],[64,3]],[[65,4],[62,2],[62,2]],
    [[60,1],[62,2],[64,3],[65,4]],[[67,5],[67,5],[67,5]],
    [[67,5],[64,3],[64,3]],[[65,4],[62,2],[62,2]],
    [[60,1],[64,3],[67,5],[67,5]],[[64,3],[60,1]]
  ],
  "ぶんぶんぶん":[
    [[67,5],[64,3],[64,3]],[[65,4],[62,2],[62,2]],
    [[60,1],[62,2],[64,3],[65,4]],[[67,5],[67,5],[67,5]],
    [[67,5],[64,3],[64,3]],[[65,4],[62,2],[62,2]],
    [[60,1],[64,3],[67,5],[64,3]],[[60,1]]
  ],
  "ジングルベル":[
    [[64,3],[64,3],[64,3]],[[64,3],[64,3],[64,3]],
    [[64,3],[67,5],[60,1],[62,2]],[[64,3]],
    [[65,4],[65,4],[65,4],[65,4]],[[65,4],[64,3],[64,3],[64,3]],
    [[64,3],[62,2],[62,2],[64,3]],[[62,2],[67,5]]
  ],
  "歓びの歌（オード・トゥ・ジョイ）":[
    [[64,3],[64,3],[65,4],[67,5]],[[67,5],[65,4],[64,3],[62,2]],
    [[60,1],[60,1],[62,2],[64,3]],[[64,3],[62,2],[62,2]],
    [[64,3],[64,3],[65,4],[67,5]],[[67,5],[65,4],[64,3],[62,2]],
    [[60,1],[60,1],[62,2],[64,3]],[[62,2],[60,1],[60,1]]
  ],
};

/* ---------- 五線に曲を描く ---------- */
const NS="http://www.w3.org/2000/svg",staff=document.getElementById("staff");
const INK="#1c1e26", DONE="#b3ada0", HALO="rgba(201,169,98,.42)";
const LINE_GAP=16,Y_BOTTOM=130,X0=72,DX=34,MG=16,Y_FINGER=40;
/* 彫版の標準比率（線間=1として）：五線0.13 / 加線0.16 / 符幹0.12・長さ3.5 / 符頭幅1.18・高さ1.0 */
const W_STAFF=LINE_GAP*0.13, W_LEDGER=LINE_GAP*0.16, W_STEM=LINE_GAP*0.12,
      L_STEM=LINE_GAP*3.5, R_HEAD_X=9.6, R_HEAD_Y=7.8, LEDGER_HALF=LINE_GAP*0.99;
/* 音部記号は環境依存のUnicodeグリフをやめ、平筆で書いた輪郭をSVGパスとして持つ。
   座標系は「線間=1、原点=G4線」。 */
const CLEF_TREBLE="M-.7,2.62L-.64,2.66L-.58,2.7L-.52,2.72L-.47,2.74L-.41,2.73L-.36,2.72L-.32,2.69L-.28,2.66L-.25,2.63L-.21,2.59L-.19,2.55L-.16,2.5L-.14,2.45L-.12,2.39L-.11,2.34L-.1,2.27L-.09,2.21L-.09,2.15L-.08,1.91L-.08,1.66L-.08,1.4L-.07,1.13L-.07,.84L-.07,.55L-.06,.25L-.06,-.06L-.05,-.36L-.05,-.67L-.04,-.98L-.04,-1.28L-.03,-1.58L-.03,-1.88L-.02,-2.16L-.02,-2.44L-.02,-2.7L-.02,-2.95L-.01,-3.05L-.01,-3.13L-.02,-3.21L-.03,-3.28L-.05,-3.35L-.07,-3.41L-.09,-3.47L-.12,-3.52L-.15,-3.57L-.19,-3.61L-.23,-3.65L-.28,-3.67L-.33,-3.65L-.37,-3.62L-.41,-3.59L-.45,-3.55L-.49,-3.5L-.54,-3.44L-.58,-3.39L-.61,-3.33L-.64,-3.27L-.66,-3.2L-.68,-3.13L-.69,-3.06L-.7,-2.99L-.71,-2.91L-.71,-2.84L-.71,-2.76L-.7,-2.68L-.69,-2.59L-.67,-2.51L-.65,-2.43L-.62,-2.35L-.59,-2.27L-.55,-2.19L-.51,-2.11L-.45,-2.03L-.38,-1.94L-.31,-1.86L-.24,-1.77L-.16,-1.69L-.08,-1.61L.01,-1.54L.09,-1.46L.18,-1.38L.27,-1.31L.36,-1.23L.45,-1.15L.54,-1.07L.63,-.99L.71,-.91L.8,-.82L.88,-.72L.97,-.62L1.05,-.49L1.12,-.35L1.18,-.21L1.22,-.07L1.26,.07L1.28,.22L1.29,.37L1.29,.51L1.27,.66L1.25,.8L1.2,.94L1.15,1.08L1.08,1.21L.99,1.33L.9,1.44L.79,1.55L.67,1.64L.53,1.72L.38,1.78L.23,1.82L.08,1.84L-.06,1.84L-.19,1.83L-.32,1.8L-.45,1.76L-.58,1.74L-.7,1.71L-.83,1.66L-.95,1.6L-1.06,1.52L-1.17,1.43L-1.26,1.32L-1.35,1.2L-1.42,1.06L-1.47,.9L-1.5,.75L-1.52,.61L-1.53,.47L-1.51,.33L-1.48,.19L-1.44,.06L-1.38,-.07L-1.31,-.19L-1.23,-.31L-1.14,-.41L-1.03,-.5L-.92,-.58L-.8,-.64L-.68,-.68L-.55,-.71L-.42,-.71L-.29,-.7L-.17,-.67L-.05,-.63L.05,-.61L.15,-.59L.24,-.55L.32,-.51L.39,-.46L.46,-.39L.51,-.32L.55,-.24L.58,-.16L.59,-.08L.6,.01L.59,.09L.56,.18L.52,.25L.47,.33L.4,.4L.33,.46L.24,.51L.16,.53L.09,.53L.02,.53L-.04,.52L-.1,.51L-.16,.49L-.21,.46L-.26,.43L-.3,.39L-.33,.34L-.35,.29L-.37,.24L-.37,.18L-.36,.13L-.34,.08L-.31,.03L-.27,-.02L-.22,-.06L-.22,-.06L-.27,-.01L-.3,.04L-.32,.09L-.34,.14L-.34,.19L-.33,.23L-.32,.28L-.3,.32L-.27,.36L-.24,.4L-.2,.44L-.15,.47L-.1,.49L-.04,.51L.02,.51L.08,.5L.14,.48L.2,.45L.27,.39L.33,.33L.38,.26L.41,.2L.43,.13L.45,.07L.45,0L.45,-.06L.44,-.13L.42,-.19L.39,-.25L.36,-.31L.31,-.37L.26,-.43L.2,-.48L.12,-.53L.04,-.58L-.05,-.61L-.18,-.63L-.3,-.62L-.4,-.59L-.5,-.55L-.6,-.5L-.68,-.43L-.75,-.36L-.82,-.28L-.89,-.2L-.95,-.11L-1,-.01L-1.04,.09L-1.08,.19L-1.11,.29L-1.13,.39L-1.14,.49L-1.14,.59L-1.14,.69L-1.12,.83L-1.1,.95L-1.06,1.06L-1.02,1.17L-.97,1.27L-.91,1.37L-.83,1.46L-.75,1.54L-.66,1.61L-.55,1.68L-.44,1.73L-.32,1.73L-.19,1.72L-.07,1.7L.05,1.66L.16,1.61L.27,1.55L.37,1.48L.46,1.39L.54,1.3L.61,1.21L.68,1.11L.73,1.01L.77,.91L.81,.81L.84,.7L.87,.59L.88,.48L.89,.37L.89,.25L.89,.13L.87,.01L.85,-.11L.82,-.24L.77,-.36L.73,-.48L.68,-.57L.62,-.67L.55,-.76L.48,-.85L.4,-.93L.32,-1.01L.24,-1.1L.15,-1.17L.07,-1.25L-.02,-1.33L-.11,-1.41L-.19,-1.49L-.28,-1.56L-.37,-1.64L-.45,-1.72L-.53,-1.81L-.61,-1.89L-.69,-1.99L-.75,-2.07L-.81,-2.16L-.86,-2.25L-.9,-2.34L-.94,-2.44L-.96,-2.54L-.99,-2.63L-1,-2.73L-1,-2.83L-1,-2.93L-.99,-3.03L-.97,-3.12L-.95,-3.21L-.91,-3.3L-.87,-3.38L-.82,-3.46L-.76,-3.53L-.7,-3.6L-.63,-3.66L-.56,-3.7L-.48,-3.73L-.4,-3.73L-.33,-3.72L-.27,-3.7L-.21,-3.69L-.15,-3.68L-.08,-3.65L-.02,-3.61L.03,-3.56L.08,-3.49L.12,-3.42L.16,-3.34L.19,-3.25L.21,-3.15L.22,-3.05L.22,-2.95L.22,-2.7L.22,-2.44L.22,-2.16L.22,-1.88L.21,-1.58L.21,-1.28L.21,-.98L.21,-.67L.2,-.36L.2,-.05L.19,.25L.18,.55L.18,.85L.17,1.13L.16,1.41L.15,1.67L.14,1.92L.13,2.15L.12,2.24L.1,2.32L.08,2.39L.05,2.46L.01,2.53L-.03,2.59L-.07,2.64L-.12,2.68L-.18,2.72L-.24,2.74L-.3,2.76L-.35,2.76L-.41,2.76L-.47,2.75L-.52,2.73L-.58,2.71L-.64,2.67L-.7,2.62Z";
function mk(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function line(x1,y1,x2,y2,w,c){staff.appendChild(mk("line",{x1,y1,x2,y2,stroke:c||INK,"stroke-width":w||W_STAFF}));}
const yFor=s=>Y_BOTTOM-s*(LINE_GAP/2);

let phrase=[], measures=[], idx=0;

function barLine(x,topY,dbl){
  line(x,topY,x,Y_BOTTOM,dbl?2.6:1.2,INK);
  if(dbl) line(x-4,topY,x-4,Y_BOTTOM,1.2,INK);
}
function drawPhrase(){
  while(staff.firstChild) staff.removeChild(staff.firstChild);
  const showAll=document.getElementById("allFinger").checked;
  const topY=Y_BOTTOM-4*LINE_GAP;
  let total=X0; measures.forEach(mr=>total+=mr.length*DX+MG);
  const width=total+30;
  staff.setAttribute("viewBox",`0 0 ${width} 172`); staff.setAttribute("width",width);
  for(let i=0;i<5;i++) line(20,Y_BOTTOM-i*LINE_GAP,width-10,Y_BOTTOM-i*LINE_GAP,W_STAFF);
  staff.appendChild(mk("path",{d:CLEF_TREBLE,fill:INK,transform:`translate(46,${yFor(2)}) scale(${LINE_GAP})`}));

  let x=X0, gi=0, curX=X0;
  measures.forEach((mr,mi)=>{
    mr.forEach(n=>{
      const m=n[0],finger=n[1];
      const steps=info(m).diatonic-E4, y=yFor(steps);
      const color = gi<idx ? DONE : INK;
      if(gi===idx){ curX=x; staff.appendChild(mk("circle",{cx:x,cy:y,r:15,fill:HALO})); }
      for(let s=-2;s>=steps;s-=2) line(x-LEDGER_HALF,yFor(s),x+LEDGER_HALF,yFor(s),W_LEDGER,color);
      for(let s=10;s<=steps;s+=2) line(x-LEDGER_HALF,yFor(s),x+LEDGER_HALF,yFor(s),W_LEDGER,color);
      staff.appendChild(mk("ellipse",{cx:x,cy:y,rx:R_HEAD_X,ry:R_HEAD_Y,transform:`rotate(-20 ${x} ${y})`,fill:color}));
      const up=steps<4,sx=up?x+(R_HEAD_X-W_STEM/2):x-(R_HEAD_X-W_STEM/2); line(sx,y,sx,up?y-L_STEM:y+L_STEM,W_STEM,color);
      if(!info(m).nat){ const sh=mk("text",{x:x-22,y:y+5,"font-size":18,fill:color});sh.textContent="♯";staff.appendChild(sh);}
      const jump = gi>0 && Math.abs(finger-phrase[gi-1][1])>=2;
      if(finger && (gi===0||showAll||jump)){
        const t=mk("text",{x,y:Y_FINGER,"font-size":15,"text-anchor":"middle",fill:gi===idx?"#96712a":"#8d8878","font-weight":"700"});
        t.textContent=finger; staff.appendChild(t);
      }
      x+=DX; gi++;
    });
    barLine(x-DX/2, topY, mi===measures.length-1);
    x+=MG;
  });
  const wrap=document.getElementById("staffWrap");
  wrap.scrollLeft = Math.max(0, curX - wrap.clientWidth*0.5);
}

/* ---------- 画面の鍵盤 ---------- */
function buildPiano(){
  const whites=[];for(let m=60;m<=76;m++) if(isNatural(m)) whites.push(m);
  const W=46,BW=28,piano=document.getElementById("piano");piano.innerHTML="";
  piano.style.width=(whites.length*W)+"px";
  whites.forEach((m,i)=>{
    const w=document.createElement("div");w.className="wkey";w.dataset.note=m;w.style.left=(i*W)+"px";
    const key=MIDI2KEY[m];
    w.innerHTML=`<span>${key===";"?"；":key.toUpperCase()}</span><span class="lo">${SOLFEGE[info(m).pc]}</span>`;
    piano.appendChild(w);
    const pc=info(m).pc;
    if([0,2,5,7,9].includes(pc)&&i<whites.length-1){
      const bm=m+1,b=document.createElement("div");b.className="bkey";b.dataset.note=bm;b.style.left=(i*W+W-BW/2)+"px";
      b.textContent=(MIDI2KEY[bm]||"").toUpperCase();piano.appendChild(b);
    }
  });
  refreshTargetHint();
  syncKb();
}
function keyEl(m){return document.querySelector(`[data-note="${m}"]`);}
/* 鍵盤スクロール用スライダー（鍵に触れず左右移動） */
const pianoScroll=document.getElementById("pianoScroll"), kbScroll=document.getElementById("kbScroll");
function syncKb(){ const max=pianoScroll.scrollWidth-pianoScroll.clientWidth;
  if(max<=2){ kbScroll.style.display="none"; document.querySelector(".kbcap").style.display="none"; }
  else { kbScroll.style.display=""; document.querySelector(".kbcap").style.display="";
    kbScroll.value = pianoScroll.scrollLeft/max*100; } }
kbScroll.addEventListener("input",()=>{ const max=pianoScroll.scrollWidth-pianoScroll.clientWidth;
  pianoScroll.scrollLeft = kbScroll.value/100*max; });
pianoScroll.addEventListener("scroll",syncKb);
window.addEventListener("resize",syncKb);
function refreshTargetHint(){
  document.querySelectorAll(".target").forEach(e=>e.classList.remove("target"));
  if(document.getElementById("hintKey").checked && idx<phrase.length){
    const t=keyEl(phrase[idx][0]); if(t) t.classList.add("target");
  }
}

/* ---------- 音（Web Audio） ---------- */
let actx=null,master=null;const voices={};
function ensureAudio(){ if(actx) return;
  actx=new (window.AudioContext||window.webkitAudioContext)();
  master=actx.createGain(); master.gain.value=document.getElementById("vol").value/100; master.connect(actx.destination);
}
const midiFreq=m=>440*Math.pow(2,(m-69)/12);
function noteOn(m){ ensureAudio(); if(voices[m]) return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type="triangle"; o.frequency.value=midiFreq(m);
  const t=actx.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+0.01);
  o.connect(g); g.connect(master); o.start(); voices[m]={o,g};
}
function noteOff(m){ const v=voices[m]; if(!v) return; const t=actx.currentTime;
  v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value,t);
  v.g.gain.linearRampToValueAtTime(0,t+0.12); v.o.stop(t+0.14); delete voices[m];
}
document.getElementById("vol").addEventListener("input",e=>{ if(master) master.gain.value=e.target.value/100; });

/* ---------- 判定 ---------- */
function judge(m){
  if(idx>=phrase.length) return;
  if(m===phrase[idx][0]){
    idx++; drawPhrase(); refreshTargetHint();
    if(idx>=phrase.length){ setMsg("完了　最後まで正しく演奏できました","var(--accent)"); }
    else setMsg("正解　次の音へ","var(--ok)");
  } else {
    setMsg("音が違います。譜面で示されている音符を演奏してください","var(--ng)");
    const cur=keyEl(phrase[idx][0]); // 正解キーを一瞬ゆらす
  }
}
function setMsg(s,c){const el=document.getElementById("msg");el.textContent=s;el.style.color=c||"var(--text)";}

/* ---------- 入力（PCキーボード） ---------- */
const pressed=new Set();
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase(); if(!(k in KEYMAP)) return; e.preventDefault();
  if(pressed.has(k)) return; pressed.add(k);
  const m=KEYMAP[k]; noteOn(m); const el=keyEl(m); if(el) el.classList.add("active"); judge(m);
});
window.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase(); if(!(k in KEYMAP)) return; pressed.delete(k);
  const m=KEYMAP[k]; noteOff(m); const el=keyEl(m); if(el) el.classList.remove("active");
});
/* 画面鍵盤クリック/タップでも鳴らす＆判定 */
document.getElementById("piano").addEventListener("pointerdown",e=>{
  const k=e.target.closest(".wkey,.bkey"); if(!k) return; const m=+k.dataset.note;
  noteOn(m); k.classList.add("active"); judge(m);
});
["pointerup","pointerleave","pointercancel"].forEach(ev=>
  document.getElementById("piano").addEventListener(ev,e=>{
    const k=e.target.closest(".wkey,.bkey"); if(!k) return; noteOff(+k.dataset.note); k.classList.remove("active");
  }));

/* ---------- 選曲・リセット ---------- */
function loadTune(name){
  measures=TUNES[name].map(mr=>mr.map(n=>n.slice()));
  phrase=measures.flat(); idx=0; drawPhrase(); refreshTargetHint();
  setMsg("最初の音符から演奏してください（鍵盤に書かれた文字がPCのキーです）","var(--muted)"); }
const sel=document.getElementById("tuneSel");
Object.keys(TUNES).forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o);});
sel.addEventListener("change",()=>loadTune(sel.value));
document.getElementById("resetBtn").addEventListener("click",()=>loadTune(sel.value));
document.getElementById("allFinger").addEventListener("change",drawPhrase);
document.getElementById("hintKey").addEventListener("change",refreshTargetHint);

document.getElementById("hint").innerHTML=
  'キー割り当て：白鍵 <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd><kbd>；</kbd> がド4〜ミ5、'+
  '黒鍵（♯）は上段の <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd><kbd>O</kbd><kbd>P</kbd> です。<br>'+
  '<b>金色で示されている音符</b>が次に弾く音です。正しく弾くと薄い表示に変わり、次の音へ進みます。リズムは自由なので、自分のペースで構いません。';

/* init */
buildPiano(); loadTune(sel.value);
</script>
</body>
</html>
